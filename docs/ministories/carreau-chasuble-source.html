<!doctype html><meta charset="utf-8"><style>@font-face{font-family:Outfit;font-weight:400 800;src:url(outfit-latin.woff2)}
body{margin:0;width:1200px;height:760px;background:#F1EEE6;font-family:Outfit;display:flex}
.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.n{background:#1B2A4A}
p{font-weight:700;font-size:26px;margin:6px}.n p{color:#F1EEE6}</style>
<div class="c"><div id="a"></div><p>Fier · pose « montre »</p></div>
<div class="c n"><div id="b"></div><p>De nuit · pose « court »</p></div>
<div class="c"><div id="c"></div><p>Panique · pose « court »</p></div>
<script src="carreau.js"></script><script>
// Accessoires temporaires « course de nuit » posés PAR-DESSUS le module officiel (non modifié).
const P=PALETTE;
function course(svg,{num='36',lampe=true,incl=0}={}){
  const acc=`<g transform="rotate(${incl} 160 150)">
   ${lampe?`<path d="M156 30 L60 -50 L252 -50 Z" fill="#FFF6C8" opacity=".55"/>`:''}
   <rect x="52" y="26" width="208" height="14" fill="${P.bleu}" stroke="${P.encre}" stroke-width="5"/>
   ${lampe?`<rect x="138" y="16" width="36" height="30" rx="6" fill="${P.encre}"/><circle cx="156" cy="31" r="9" fill="${P.jaune}"/>`:''}
   <g transform="translate(156 262)"><rect x="-66" y="-30" width="132" height="78" fill="#fff" stroke="${P.encre}" stroke-width="6"/>
    <rect x="-66" y="-30" width="132" height="22" fill="${P.bleu}"/><text y="-13" font-family="Outfit" font-weight="800" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="2">SAINTÉLYON</text>
    <text y="36" font-family="Outfit" font-weight="800" font-size="40" fill="${P.encre}" text-anchor="middle">${num}</text>
    ${[-54,54].map(x=>`<circle cx="${x}" cy="0" r="4" fill="${P.encre}"/>`).join('')}</g></g>`;
  return svg.replace('</svg>',acc+'</svg>');
}
a.innerHTML=course(carreau({expression:'fier',pose:'montre',taille:320}),{lampe:false});
b.innerHTML=course(carreau({expression:'soulage',pose:'court',taille:320}),{incl:-8});
c.innerHTML=course(carreau({expression:'panique',pose:'court',taille:320}),{incl:-8});
</script>
