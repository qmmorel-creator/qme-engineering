<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les partiels de médecine · Mini-story QME</title>
<!-- Projet d'animation de l'épisode. Rendu : node docs/videos/rendu.mjs <ce fichier> 21.3 --muet --taille-max 14 (format v2 : montage recalé dans timeline.json)
     Toute l'image est fonction du temps : window.placer(ms) dessine l'image exacte de l'instant ms (rendu déterministe).
     Données : timeline.js (généré depuis timeline.json, voix réelles mesurées). -->
<style>
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212;}
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C4;}
:root{--creme:#F1EEE6;--noir:#141414;--jaune:#FFBE00;--jaune-pale:#FBEBC2;--bleu:#23528B;--rouge:#DE2D27;--moutarde:#EDB43A;--vert:#2E7D50}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:'Outfit',sans-serif;color:var(--noir)}
#scene{position:absolute;inset:0}
#st{position:absolute;left:60px;right:130px;top:1350px;display:flex;justify-content:center;text-align:center}
#st span{display:inline;background:var(--jaune-pale);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 22px;border-radius:18px;font-weight:800;font-size:56px;line-height:1.45;letter-spacing:-.5px}
#carton{position:absolute;inset:0;background:#141414;display:none}
#carton img{position:absolute;left:0;width:1080px;top:50%;transform:translateY(-50%)}
.pre{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="st"></div>
<div id="carton"><img src="../assets/qme-carton-final-9x16-official.png" alt=""></div>
<img class="pre" src="../assets/templates-revision-tel.webp" alt=""><img class="pre" src="../assets/templates-revision-planning.webp" alt=""><img class="pre" src="../assets/templates-notes-objectifs.webp" alt="">
<script src="timeline.js"></script>
<script src="carreau.js"></script>
<script>
const C = {creme:'#F1EEE6', noir:'#141414', jaune:'#FFBE00', pale:'#FBEBC2', bleu:'#23528B', rouge:'#DE2D27', moutarde:'#EDB43A', vert:'#2E7D50', blanc:'#FFFFFF'};
const PAS_POSE = 1000 / 12;              // poses tenues 2 images à 24 i/s : rendu « stop-motion » de la charte MiniStories
const pose = (ms) => Math.floor(ms / PAS_POSE) * PAS_POSE;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (x) => 1 - Math.pow(1 - x, 3);
const rebond = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const euros = (v) => v.toLocaleString('fr-FR').replace(/\u202f|\s/g, '\u2009') + '\u00a0€';
const T = window.TL;
// Temps vidéo -> temps du montage de référence (scènes recalées sur la voix réelle), interpolation linéaire par morceaux.
const recaler = (t) => { const M = T.montage; if (!M) return t; for (let i = 1; i < M.length; i++) if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]); return M[M.length - 1][1] + t - M[M.length - 1][0]; };

// ---------- Mascotte : post-it jaune « A1 » (référence qme-mascot-original-reference.jpeg) ----------
// Une seule fonction pour tout l'épisode : mêmes proportions, couleurs et traits d'un plan à l'autre.
// Accessoire TEMPORAIRE (non validé par Quentin) : blouse blanche + stéthoscope posés PAR-DESSUS carreau() sans le modifier,
// sur le modèle de course() (docs/ministories/carreau-chasuble-source.html), dans le repère 320 × 380 du module.
// Deux pans blancs sur les côtés + col central : ni les yeux, ni la bouche, ni l'étiquette « A1 » ne sont masqués.
function blouse(svg, incl = 0) {
  const E = '#141414';
  const acc = `<g transform="rotate(${incl} 160 150)">
    <path d="M46 84 L92 84 L92 254 L46 254 Z" fill="#fff" stroke="${E}" stroke-width="6"/>
    <path d="M220 84 L266 84 L266 254 L220 254 Z" fill="#fff" stroke="${E}" stroke-width="6"/>
    <rect x="62" y="200" width="22" height="16" fill="none" stroke="${E}" stroke-width="4"/>
    <path d="M118 40 L160 70 L202 40 L202 50 L160 80 L118 50 Z" fill="#fff" stroke="${E}" stroke-width="5"/>
    <path d="M114 42 Q62 34 54 84" fill="none" stroke="${E}" stroke-width="7"/>
    <path d="M206 42 Q262 34 262 120 L254 186" fill="none" stroke="${E}" stroke-width="7"/>
    <circle cx="254" cy="196" r="15" fill="#B8C4CC" stroke="${E}" stroke-width="6"/></g>`;
  return svg.replace('<svg ', '<svg style="overflow:visible" ').replace('</svg>', acc + '</svg>');
}
function mascotte({x, y, s = 1, expr = 'neutre', bras = 'bas', rot = 0, ecrase = 1}) {
  // Module officiel docs/templates/communication/formats-test/mascotte/carreau.js (copié sans « export » dans carreau.js)
  const expression = {joie: 'soulage', blase: 'neutre', inquiet: 'inquiet', choc: 'inquiet', panique: 'panique', fier: 'fier', neutre: 'neutre'}[expr];
  const p = {montrer: 'montre', pouce: 'montre', haut: 'court', tete: 'court'}[bras] || 'debout';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s} ${s * ecrase}) translate(-160 -350)">${blouse(carreau({expression, pose: p, taille: 320}), p === 'court' ? -8 : 0)}</g>`;
}

// ---------- Décor Bauhaus (formes de la charte) ----------
function decor(t, variante = 0) {
  const d = Math.sin(pose(t) / 900) * 6;
  const v = [
    `<circle cx="${-40 + d}" cy="220" r="260" fill="${C.rouge}"/><circle cx="930" cy="420" r="90" fill="${C.noir}"/><rect x="820" y="1100" width="200" height="200" fill="${C.noir}"/><rect x="800" y="1080" width="200" height="200" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/>`,
    `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="120" cy="${1180 + d}" r="70" fill="${C.rouge}"/><path d="M0 1330 h260 l-130 -190z" fill="${C.noir}" opacity=".9"/>`,
    `<circle cx="1000" cy="250" r="200" fill="${C.bleu}"/><rect x="40" y="200" width="120" height="120" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`,
  ][variante];
  return `<rect width="1080" height="1920" fill="${C.creme}"/>${v}`;
}
const sol = (y = 1300) => `<rect x="0" y="${y}" width="1080" height="12" fill="${C.noir}"/>`;

// ---------- Accessoires (formes et couleurs fixes dans tout l'épisode) ----------
const etiquette = (x, y, txt, fond = C.noir, coul = '#fff', taille = 40) => { const w = txt.length * taille * .64 + 40; return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-taille * .8}" width="${w}" height="${taille * 1.3}" fill="${fond}"/><text y="${taille * .3}" font-size="${taille}" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${coul}">${txt}</text></g>`; };
const COUL = [C.rouge, C.bleu, C.jaune, C.vert];
const MAT = ['ANATOMIE', 'BIOCHIMIE', 'PHYSIOLOGIE'];
// Polycopié : liasse blanche, bandeau de couleur, nom de matière générique
const poly = (x, y, r, txt, c, s = 1) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-150" y="-40" width="300" height="80" fill="#fff" stroke="${C.noir}" stroke-width="7"/><rect x="-150" y="-40" width="300" height="22" fill="${c}" stroke="${C.noir}" stroke-width="7"/><text y="32" font-size="30" font-weight="800" letter-spacing="1" text-anchor="middle">${txt}</text></g>`;
// Fiche de révision : carte blanche, bandeau de couleur de la matière, « CH. n »
const fiche = (x, y, r, n, s = 1) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-110" y="-70" width="220" height="140" fill="#fff" stroke="${C.noir}" stroke-width="7"/><rect x="-110" y="-70" width="220" height="34" fill="${COUL[(typeof n === 'number' ? n : 1) % 4]}" stroke="${C.noir}" stroke-width="7"/><text y="38" font-size="46" font-weight="800" text-anchor="middle">CH. ${n}</text></g>`;
function pile(x, y, n, desordre = 0) { let g = ''; for (let i = 0; i < n; i++) g += fiche(x + (hash(i) - .5) * (20 + desordre * 160), y - i * 26, (hash(i + 7) - .5) * (6 + desordre * 50), n - i, .8); return g; }
function horloge(x, y, h, m, r = 120) {
  const ah = ((h % 12) + m / 60) * 30, am = m * 6;
  return `<g transform="translate(${x} ${y})"><circle r="${r}" fill="#fff" stroke="${C.noir}" stroke-width="10"/>${[0, 90, 180, 270].map((a) => `<rect x="-5" y="${-r + 14}" width="10" height="22" fill="${C.noir}" transform="rotate(${a})"/>`).join('')}<rect x="-7" y="${-r * .5}" width="14" height="${r * .5}" fill="${C.noir}" transform="rotate(${ah})"/><rect x="-4" y="${-r * .78}" width="8" height="${r * .78}" fill="${C.rouge}" transform="rotate(${am})"/><circle r="12" fill="${C.noir}"/></g>`;
}
const heure = (x, y, txt, fond = C.noir) => etiquette(x, y, txt, fond, '#fff', 44);
const tasse = (x, y, the = false) => `<g transform="translate(${x} ${y})"><path d="M-44 -50 h88 v70 q0 30 -30 30 h-28 q-30 0 -30 -30 z" fill="${the ? C.pale : C.noir}" stroke="${C.noir}" stroke-width="7"/><path d="M44 -36 q34 0 34 26 q0 26 -34 26" fill="none" stroke="${C.noir}" stroke-width="7"/>${the ? '' : `<rect x="-30" y="-20" width="60" height="12" fill="${C.moutarde}"/>`}</g>`;
const lune = (x, y, r = 90) => `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/><circle cx="${r * .45}" cy="${-r * .25}" r="${r * .85}" fill="${C.bleu}"/></g>`;
const bureau = (y = 1300) => `<rect x="0" y="${y}" width="1080" height="16" fill="${C.noir}"/><rect x="120" y="${y + 16}" width="20" height="200" fill="${C.noir}"/><rect x="940" y="${y + 16}" width="20" height="200" fill="${C.noir}"/>`;

// Téléphone avec une vraie capture du Planning de révision (assets/templates-revision-tel.webp, 780 × 1328)
function telephone(x, y, s, contenu) {
  const W = 700, H = 1300;
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-W / 2} ${-H / 2})"><rect x="16" y="16" width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect x="24" y="24" width="${W - 48}" height="${H - 48}" rx="40" fill="#FAF7F0"/>${contenu}</g>`;
}

// ---------- Scènes ----------
const S = {};
function montagne(n, desordre, cx = 720, base = 1290) { let g = ''; for (let i = 0; i < n; i++) g += poly(cx + (hash(i) - .5) * (30 + desordre * 120), base - i * 40, (hash(i + 7) - .5) * (4 + desordre * 30), MAT[i % 3], COUL[i % 3], .9); return g; }
S.S1 = (t, l) => {                       // Partiels de médecine : la montagne de polycopiés
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><circle cx="1000" cy="300" r="240" fill="${C.bleu}"/><rect x="40" y="250" width="110" height="110" fill="${C.rouge}" stroke="${C.noir}" stroke-width="10"/>` + bureau();
  const n = Math.min(18, 4 + Math.floor(pose(l) / 220));
  g += montagne(n, .4);
  g += etiquette(540, 470, 'PARTIELS', C.noir, '#fff', 70);
  const mats = [[1.72, 'ANATOMIE', C.rouge, 520], [2.7, 'BIOCHIMIE', C.bleu, 640], [3.6, 'PHYSIOLOGIE', C.vert, 760]];
  for (const [a, txt, c, y] of mats) if (t >= a) { const q = rebond(prog(pose(t * 1000), a * 1000, a * 1000 + 300)); g += `<g transform="translate(330 ${y + 120}) scale(${q})">${etiquette(0, 0, txt, c, '#fff', 54)}</g>`; }
  g += mascotte({x: 260, y: 1300, s: .95, expr: t < 1.7 ? 'neutre' : 'inquiet'});
  return g;
};
S.S2 = (t, l) => {                       // Coefficients qui s'envolent
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>` + bureau();
  g += montagne(18, .6);
  const co = [[5.12, 'COEF. 3', 380, C.rouge], [6.4, 'COEF. 4', 640, C.bleu]];
  for (const [a, txt, y, c] of co) if (t >= a) { const p = prog(pose(t * 1000), a * 1000, a * 1000 + 1400); const q = rebond(prog(pose(t * 1000), a * 1000, a * 1000 + 300)); g += `<g transform="translate(380 ${y + 260 - p * 120}) scale(${q * (1 + p * .5)})">${etiquette(0, 0, txt, c, '#fff', 80)}</g>`; }
  g += mascotte({x: 280, y: 1300 - Math.abs(Math.sin(pose(l) / 110)) * 24, s: .95, expr: t < 6.4 ? 'inquiet' : 'panique', bras: 'haut'});
  return g;
};
S.S3 = (t, l) => {                       // 3 h du matin : l'avalanche
  const chute = t >= 9.5;
  let g = `<rect width="1080" height="1920" fill="${C.noir}"/><circle cx="540" cy="620" r="360" fill="${C.bleu}"/>` + lune(900, 300, 80);
  g += horloge(540, 560, 3, 0, 170) + heure(540, 800, '03:00', C.rouge);
  g += `<rect x="0" y="1300" width="1080" height="16" fill="${C.creme}"/>`;
  g += mascotte({x: 540, y: 1300, s: .95, expr: chute ? 'panique' : 'neutre', bras: chute ? 'haut' : 'bas'});
  for (let i = 0; i < 16; i++) {
    const p = chute ? sortie(prog(t, 9.5 + i * .02, 10.1 + i * .02)) : 0;
    const bx = 300 + hash(i) * 480, by = 1270 - (i % 8) * 50;
    const x = bx + (hash(i + 3) - .5) * 1000 * p, y = by - p * (600 + hash(i + 5) * 300);
    g += poly(x, y, (hash(i + 7) - .5) * 30 + p * 240 * (hash(i) - .5), t >= 9.7 ? '???' : MAT[i % 3], COUL[i % 3], .8);
  }
  return g;
};
S.S4 = (t, l) => {                       // Version 2 : Pack Étudiant (captures réelles du Planning de révision)
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="110" cy="290" r="70" fill="${C.rouge}"/>`;
  if (t < 14.6) {
    const p = rebond(prog(pose(l), 0, 420));
    g += etiquette(540, 290, 'PACK ÉTUDIANT', C.noir, '#fff', 56);
    g += telephone(600, 830, .62 * p, `<clipPath id="ecr"><rect x="24" y="24" width="652" height="1252" rx="40"/></clipPath><image href="../assets/templates-revision-tel.webp" x="24" y="24" width="652" height="1110" clip-path="url(#ecr)" preserveAspectRatio="xMidYMin slice"/>`);
    if (t >= 12.29) { const q = rebond(prog(pose(t * 1000), 12290, 12590)); g += `<g transform="translate(552 600) scale(${q})"><rect x="-165" y="-58" width="330" height="116" rx="18" fill="none" stroke="${C.rouge}" stroke-width="12"/></g>`; }
    if (t >= 13.38) { const q = rebond(prog(pose(t * 1000), 13380, 13680)); g += `<g transform="translate(830 1180) rotate(-8) scale(${q})">${etiquette(0, 0, 'PAS 18', C.rouge, '#fff', 64)}</g>`; }
    g += mascotte({x: 190, y: 1290, s: .6, expr: 'fier', bras: 'montrer'});
  } else {
    const p = rebond(prog(pose(t * 1000), 14600, 14950));
    g += etiquette(540, 290, 'PLANNING DE RÉVISION', C.noir, '#fff', 48);
    g += `<g transform="translate(540 700) scale(${p})"><rect x="-480" y="-200" width="960" height="400" fill="${C.noir}" transform="translate(14 14)"/><rect x="-480" y="-200" width="960" height="400" fill="#fff" stroke="${C.noir}" stroke-width="10"/>
          <svg x="-470" y="-190" width="940" height="380" viewBox="80 325 1440 580" preserveAspectRatio="xMidYMid slice"><image href="../assets/templates-revision-planning.webp" width="1600" height="1000"/></svg></g>`;
    const reps = [['J+1', 17.1, 370, C.rouge], ['J+3', 18.1, 590, C.bleu], ['J+7', 19.2, 810, C.vert]];
    for (const [txt, a, x, c] of reps) { if (t < a) continue; const q = rebond(prog(pose(t * 1000), a * 1000, a * 1000 + 300)); g += `<g transform="translate(${x} 1150) scale(${q})">${poly(0, 0, 0, 'ANATOMIE', C.rouge, .62)}</g>` + `<g transform="translate(${x} 1050) scale(${q})">${etiquette(0, 0, txt, c, '#fff', 48)}</g>`; }
    g += mascotte({x: 130, y: 1290, s: .45, expr: 'fier', bras: 'montrer'});
  }
  return g;
};
S.S5 = (t, l) => {                       // La note à viser (capture réelle de Notes et moyennes, onglet Objectifs)
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><circle cx="1000" cy="260" r="200" fill="${C.bleu}"/>`;
  const p = rebond(prog(pose(l), 0, 350));
  g += etiquette(540, 290, 'NOTES ET MOYENNES', C.noir, '#fff', 50);
  g += `<g transform="translate(540 640) scale(${p})"><rect x="-480" y="-250" width="960" height="500" fill="${C.noir}" transform="translate(14 14)"/><rect x="-480" y="-250" width="960" height="500" fill="#fff" stroke="${C.noir}" stroke-width="10"/>
        <svg x="-470" y="-240" width="940" height="480" viewBox="200 50 1220 622" preserveAspectRatio="xMidYMid slice"><image href="../assets/templates-notes-objectifs.webp" width="1600" height="1000"/></svg></g>`;
  if (t >= 21.0) { const q = rebond(prog(pose(t * 1000), 21000, 21350));
    g += `<g transform="translate(540 1060) scale(${q})"><rect x="-470" y="-80" width="940" height="160" fill="${C.noir}" transform="translate(12 12)"/><rect x="-470" y="-80" width="940" height="160" fill="#fff" stroke="${C.rouge}" stroke-width="10"/>
          <svg x="-460" y="-70" width="920" height="140" viewBox="236 832 640 98" preserveAspectRatio="xMidYMid meet"><image href="../assets/templates-notes-objectifs.webp" width="1600" height="1000"/></svg></g>`; }
  g += mascotte({x: 150, y: 1300, s: .5, expr: t < 21.0 ? 'neutre' : 'fier', bras: t < 21.0 ? 'bas' : 'montrer'});
  return g;
};
S.S6 = (t, l) => {                       // Payoff : la montagne devient une pile rangée, il dort
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><circle cx="1000" cy="300" r="240" fill="${C.bleu}"/>` + lune(960, 330, 100) + bureau();
  for (let i = 0; i < 6; i++) g += poly(760, 1250 - i * 44, 0, MAT[i % 3], COUL[i % 3], .8);
  g += etiquette(760, 920, 'RANGÉ', C.vert, '#fff', 44);
  g += horloge(250, 520, 22, 0, 110) + heure(250, 700, '22:00');
  if (t >= 24.9) for (let i = 0; i < 3; i++) { const q = ((pose(l) / 900) + i / 3) % 1; g += `<text x="${400 + i * 40 + q * 30}" y="${980 - i * 60 - q * 60}" font-size="${50 + i * 14}" font-weight="800" fill="${C.bleu}" opacity="${1 - q * .6}">Z</text>`; }
  g += mascotte({x: 300, y: 1300, s: .95, expr: t < 24.9 ? 'neutre' : 'joie', rot: t < 24.9 ? 0 : -6});
  return g;
};

const scene = document.getElementById('scene'), st = document.getElementById('st'), carton = document.getElementById('carton');
// Sous-titres : une réplique = un sous-titre, calé sur la voix réelle (début, fin + 0,12 s), deux lignes au plus.
const COUPES = { v01: 'Trois jours avant les partiels.<br>Et la pile grandit.', v02: 'Anatomie. Biochimie.<br>Physiologie.', v03: 'Coefficient trois.<br>Coefficient quatre…', v04: 'Trois heures du matin.<br>On relit quoi, déjà ?!', v05: 'Le planning répond :<br>six révisions. Pas dix-huit.' };
// Accroche v2 : texte à l'écran dès la première image, lisible sans le son
const ACCROCHE = (tv) => tv < 2.8 ? `<g><rect x="72" y="132" width="936" height="300" fill="${C.noir}" transform="translate(14 14)"/><rect x="72" y="132" width="936" height="300" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><text x="540" y="262" font-size="96" font-weight="800" text-anchor="middle" fill="${C.noir}">18 polycopiés.</text><text x="540" y="372" font-size="64" font-weight="800" text-anchor="middle" fill="${C.rouge}">Trois jours. Rien de relu.</text></g>` : '';
window.placer = (ms) => {
  const tv = ms / 1000; const t = recaler(tv); ms = t * 1000; window.__t = ms;
  const fin = tv >= T.carton.debut;
  carton.style.display = fin ? 'block' : 'none';
  if (fin) { scene.innerHTML = ''; st.innerHTML = ''; return; }
  const sc = T.scenes.find((s) => t >= s.debut && t < s.fin) || T.scenes[0];
  scene.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${S[sc.id](t, ms - sc.debut * 1000)}${ACCROCHE(tv)}</svg>`;
  const v = T.voix.find((r) => tv >= r.t - .05 && tv < Math.min(r.fin + .12, T.carton.debut));
  const cp = v && COUPES[v.id]; st.innerHTML = v ? `<span>${typeof cp === 'function' ? cp(tv) : cp || v.texte.replace(/'/g, '’')}</span>` : '';
};
window.placer(0);
</script>
</body>
</html>
