<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Qui a payé les croissants ? · Mini-story QME</title>
<!-- Projet d'animation de l'épisode. Rendu : node docs/videos/rendu.mjs <ce fichier> 28.3 --muet --taille-max 14
     Toute l'image est fonction du temps : window.placer(ms) dessine l'image exacte de l'instant ms (rendu déterministe).
     Données : timeline.js (généré depuis timeline.json, voix réelles mesurées). -->
<style>
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212;}
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C4;}
:root{--creme:#F1EEE6;--noir:#141414;--jaune:#FFBE00;--jaune-pale:#FBEBC2;--bleu:#23528B;--rouge:#DE2D27;--moutarde:#EDB43A;--vert:#2E7D50}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:'Outfit',sans-serif;color:var(--noir)}
#scene{position:absolute;inset:0}
#st{position:absolute;left:60px;right:130px;top:1350px;display:flex;justify-content:center;text-align:center}
#st span{display:inline;background:var(--jaune-pale);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 22px;border-radius:18px;font-weight:800;font-size:56px;line-height:1.45;letter-spacing:-.5px}
#st span.petit{font-size:46px}
#carton{position:absolute;inset:0;background:#141414;display:none}
#carton img{position:absolute;left:0;width:1080px;top:50%;transform:translateY(-50%)}
.pre{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="st"></div>
<div id="carton"><img src="../assets/qme-carton-final-9x16-official.png" alt=""></div>
<img class="pre" src="../assets/templates-budget-commun-tel.webp" alt=""><img class="pre" src="../assets/templates-budget-commun-soldes.webp" alt="">
<script src="timeline.js"></script>
<script src="carreau.js"></script>
<script>
const C = {creme:'#F1EEE6', noir:'#141414', jaune:'#FFBE00', pale:'#FBEBC2', bleu:'#23528B', rouge:'#DE2D27', moutarde:'#EDB43A', vert:'#2E7D50', blanc:'#FFFFFF'};
const PAS_POSE = 1000 / 12;              // poses tenues 2 images à 24 i/s : rendu « stop-motion » de la charte MiniStories
const pose = (ms) => Math.floor(ms / PAS_POSE) * PAS_POSE;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (x) => 1 - Math.pow(1 - x, 3);
const rebond = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const euros = (v) => v.toLocaleString('fr-FR').replace(/\u202f|\s/g, '\u2009') + '\u00a0€';
const T = window.TL;
// Temps vidéo -> temps du montage de référence (scènes recalées sur la voix réelle), interpolation linéaire par morceaux.
const recaler = (t) => { const M = T.montage; if (!M) return t; for (let i = 1; i < M.length; i++) if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]); return M[M.length - 1][1] + t - M[M.length - 1][0]; };

// ---------- Mascotte : post-it jaune « A1 » (référence qme-mascot-original-reference.jpeg) ----------
// Une seule fonction pour tout l'épisode : mêmes proportions, couleurs et traits d'un plan à l'autre.
function mascotte({x, y, s = 1, expr = 'neutre', bras = 'bas', rot = 0, ecrase = 1}) {
  // Module officiel docs/templates/communication/formats-test/mascotte/carreau.js (copié sans « export » dans carreau.js)
  const expression = {joie: 'soulage', blase: 'neutre', inquiet: 'inquiet', choc: 'inquiet', panique: 'panique', fier: 'fier', neutre: 'neutre'}[expr];
  const p = {montrer: 'montre', pouce: 'montre', haut: 'court', tete: 'court'}[bras] || 'debout';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s} ${s * ecrase}) translate(-160 -350)">${carreau({expression, pose: p, taille: 320})}</g>`;
}

// ---------- Décor Bauhaus (formes de la charte) ----------
function decor(t, variante = 0) {
  const d = Math.sin(pose(t) / 900) * 6;
  const v = [
    `<circle cx="${-40 + d}" cy="220" r="260" fill="${C.rouge}"/><circle cx="930" cy="420" r="90" fill="${C.noir}"/><rect x="820" y="1100" width="200" height="200" fill="${C.noir}"/><rect x="800" y="1080" width="200" height="200" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/>`,
    `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="120" cy="${1180 + d}" r="70" fill="${C.rouge}"/><path d="M0 1330 h260 l-130 -190z" fill="${C.noir}" opacity=".9"/>`,
    `<circle cx="1000" cy="250" r="200" fill="${C.bleu}"/><rect x="40" y="200" width="120" height="120" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`,
  ][variante];
  return `<rect width="1080" height="1920" fill="${C.creme}"/>${v}`;
}
const sol = (y = 1300) => `<rect x="0" y="${y}" width="1080" height="12" fill="${C.noir}"/>`;

// ---------- Accessoires (colocataires = tasses Bauhaus sans visage ; Carreau est la seule mascotte) ----------
const etiquette = (x, y, txt, fond = C.noir, coul = '#fff', taille = 40) => { const w = txt.length * taille * .64 + 40; return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-taille * .8}" width="${w}" height="${taille * 1.3}" fill="${fond}"/><text y="${taille * .3}" font-size="${taille}" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${coul}">${txt}</text></g>`; };
// Tasse : Camille = bleue (rectangle), Sami = jaune (trapèze) ; couleurs reprises de la capture réelle
function tasse(qui, x, y, s = 1, rot = 0) {
  const bleu = qui === 'camille', coul = bleu ? C.bleu : C.jaune;
  const corps = bleu ? `<rect x="-80" y="-170" width="160" height="170" fill="${coul}" stroke="${C.noir}" stroke-width="10"/>` : `<path d="M-90 -170 H90 L70 0 H-70 Z" fill="${coul}" stroke="${C.noir}" stroke-width="10"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M78 -140 a50 50 0 0 1 0 100" fill="none" stroke="${C.noir}" stroke-width="16"/>${corps}<rect x="-60" y="-150" width="120" height="16" fill="${C.noir}" opacity=".25"/>${etiquette(0, 60, bleu ? 'CAMILLE' : 'SAMI', C.noir, '#fff', 30)}</g>`;
}
const croissant = (x, y, s = 1, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M-130 30 Q-120 -90 0 -95 Q120 -90 130 30 Q90 -20 60 -25 Q0 -40 -60 -25 Q-90 -20 -130 30 Z" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="9" stroke-linejoin="round"/><path d="M-50 -88 l14 60 M0 -95 v62 M50 -88 l-14 60" stroke="${C.noir}" stroke-width="7"/></g>`;
const assiette = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="220" ry="60" fill="#fff" stroke="${C.noir}" stroke-width="10"/><ellipse rx="140" ry="34" fill="none" stroke="${C.noir}" stroke-width="5" opacity=".4"/></g>`;
const miettes = (x, y) => { let g = ''; for (let i = 0; i < 9; i++) g += `<rect x="${x + (hash(i) - .5) * 260}" y="${y - 20 + hash(i + 9) * 30}" width="${10 + hash(i + 3) * 10}" height="${8 + hash(i + 5) * 8}" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="3"/>`; return g; };
function ticket(x, y, r = 0, s = 1, tampon = false, txt = 'PAYÉ !') {
  let g = `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M-70 -95 H70 V85 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 l-14 12 l-14 -12 Z" fill="#fff" stroke="${C.noir}" stroke-width="7"/>`;
  for (let i = 0; i < 4; i++) g += `<rect x="-48" y="${-70 + i * 30}" width="${60 + hash(i + x) * 36}" height="10" fill="${C.noir}" opacity=".3"/>`;
  if (tampon) g += `<g transform="rotate(-14)"><rect x="-82" y="-10" width="164" height="62" fill="none" stroke="${C.rouge}" stroke-width="8"/><text y="38" font-size="40" font-weight="800" text-anchor="middle" fill="${C.rouge}">${txt}</text></g>`;
  return g + '</g>';
};
function marteau(x, y, ang = -35, s = 1) { return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${s})"><rect x="-10" y="-10" width="20" height="170" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="7"/><rect x="-60" y="-60" width="120" height="60" rx="8" fill="${C.noir}"/></g>`; }
function telephone(x, y, s, contenu) {
  const W = 700, H = 1300;
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-W / 2} ${-H / 2})"><rect x="16" y="16" width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect x="24" y="24" width="${W - 48}" height="${H - 48}" rx="40" fill="#FAF7F0"/>${contenu}</g>`;
}
// Cadre avec un extrait de la capture réelle assets/templates-budget-commun-soldes.webp (1600 × 1000)
function extrait(cx, cy, w, h, vb, s = 1) {
  return `<g transform="translate(${cx} ${cy}) scale(${s})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${C.noir}" transform="translate(14 14)"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="#FAF7F0" stroke="${C.noir}" stroke-width="10"/><svg x="${-w / 2 + 10}" y="${-h / 2 + 10}" width="${w - 20}" height="${h - 20}" viewBox="${vb}" preserveAspectRatio="xMidYMid slice"><image href="../assets/templates-budget-commun-soldes.webp" width="1600" height="1000"/></svg></g>`;
}

const sansCarres = (d) => d.replace(/<rect x="8[02]0" y="1[01][08]0"[^>]*\/>/g, '');
// ---------- Scènes ----------
const S = {};
S.S1 = (t, l) => {                       // Les croissants ont disparu
  let g = sansCarres(decor(t, 0)) + sol(1300);
  const vide = l >= 80;
  g += assiette(540, 720);
  g += vide ? miettes(540, 715) : croissant(540, 690);
  const q = rebond(prog(pose(l), 80, 450));
  g += `<text x="540" y="560" font-size="${300 * q}" font-weight="800" text-anchor="middle" fill="${C.rouge}" stroke="${C.noir}" stroke-width="8">?</text>`;
  const b1 = t > 1.45 ? Math.abs(Math.sin(pose(l) / 130)) * 40 : 0, b2 = t > 1.45 ? Math.abs(Math.cos(pose(l) / 130)) * 40 : 0;
  g += tasse('camille', 200, 1290 - b1, .9, b1 > 20 ? -6 : 0) + tasse('sami', 830, 1290 - b2, .9, b2 > 20 ? 6 : 0);
  g += mascotte({x: 520, y: 1300, s: .85, expr: l < 400 ? 'choc' : 'blase', bras: l < 400 ? 'tete' : 'bas'});
  return g;
};
S.S2 = (t, l) => {                       // Tout le monde a tout payé
  const tours = [[3.4, 4.85, 'LOYER', C.bleu], [5.4, 6.95, 'PAPIER TOILETTE', C.rouge], [7.55, 8.75, 'COURSES', C.jaune]];
  let k = 0; for (let i = 0; i < 3; i++) if (t >= tours[i][0]) k = i;
  const [a, tp, nom, coul] = tours[k];
  let g = decor(t, 2) + sol(1300);
  const p = rebond(prog(pose(t * 1000), a * 1000, a * 1000 + 300));
  g += `<g transform="translate(540 560) scale(${p})"><rect x="-330" y="-120" width="660" height="240" fill="${C.noir}" transform="translate(14 14)"/><rect x="-330" y="-120" width="660" height="240" fill="#fff" stroke="${C.noir}" stroke-width="10"/><rect x="-330" y="-120" width="40" height="240" fill="${coul}"/><text x="20" y="22" font-size="${nom.length > 10 ? 58 : 80}" font-weight="800" text-anchor="middle">${nom}</text><text x="20" y="86" font-size="30" font-weight="700" text-anchor="middle" fill="#555" letter-spacing="3">QUI A PAYÉ ?</text></g>`;
  const tamp = t >= tp, deux = k === 2 && tamp;
  const lev = sortie(prog(pose(t * 1000), a * 1000 + 250, a * 1000 + 600));
  g += tasse('camille', 210, 1290, .9) + tasse('sami', 830, 1290, .9);
  g += ticket(210, 1060 - lev * 120, -8, .9, tamp, deux ? 'PAYÉ ×2' : 'PAYÉ !') + ticket(830, 1060 - lev * 120, 8, .9, tamp, deux ? 'PAYÉ ×2' : 'PAYÉ !');
  const reg = Math.floor(pose(t * 1000) / 330) % 2 ? -10 : 10;
  g += mascotte({x: 520, y: 1300, s: .7, expr: k === 0 ? 'inquiet' : k === 1 ? 'choc' : 'panique', bras: k === 2 ? 'tete' : 'bas', rot: reg});
  return g;
};
S.S3 = (t, l) => {                       // Le tribunal des colocs
  let g = `<rect width="1080" height="1920" fill="${C.creme}"/><circle cx="540" cy="620" r="330" fill="${C.rouge}"/><rect x="0" y="1300" width="1080" height="12" fill="${C.noir}"/>`;
  g += etiquette(540, 300, 'TRIBUNAL DES COLOCS', C.noir, '#fff', 46);
  g += mascotte({x: 540, y: 1000, s: .75, expr: t < 11.7 ? 'neutre' : 'inquiet', bras: 'bas'});
  const coup = t >= 11.7 && t < 11.95;
  g += marteau(760, 860, coup ? 20 : -40, 1);
  g += `<rect x="190" y="1000" width="700" height="300" fill="${C.noir}"/><rect x="200" y="1010" width="680" height="40" fill="${C.moutarde}"/>`;
  g += tasse('camille', 110, 1290, .7) + tasse('sami', 960, 1290, .6);
  if (t >= 11.7) { for (let i = 0; i < 16; i++) { const a0 = 11.72 + i * .05, p = sortie(prog(t, a0, a0 + .45)); if (t < a0) break; g += ticket(260 + hash(i) * 560, -150 + p * (1150 - (i % 4) * 30), (hash(i + 2) - .5) * 70, .7); }
    g += etiquette(540, 420, 'PIÈCES À CONVICTION', C.jaune, C.noir, 34); }
  return g;
};
S.S4 = (t, l) => {                       // Gestion Dépenses Communes
  let g = decor(t, 2);
  if (t < 15.85) {                       // chacun note ce qu'il paie (capture téléphone réelle)
    const ap = rebond(prog(pose(l), 0, 400));
    g += telephone(540, 760, .62 * ap, `<clipPath id="ecr"><rect x="24" y="24" width="652" height="1252" rx="40"/></clipPath><image href="../assets/templates-budget-commun-tel.webp" x="24" y="24" width="652" height="1110" clip-path="url(#ecr)" preserveAspectRatio="xMidYMin slice"/>`);
    for (let i = 0; i < 4; i++) { const a0 = 13.4 + i * .5, p = sortie(prog(t, a0, a0 + .4)); if (t < a0 || p >= 1) continue; const g0 = i % 2 ? 940 : 140; g += ticket(g0 + (540 - g0) * p, 1150 - p * 400, 0, .55 * (1 - p * .6)); }
    g += tasse('camille', 150, 1290, .7) + tasse('sami', 790, 1290, .7);
  } else if (t < 18.75) {                // verdict au centime
    const p = rebond(prog(pose(t * 1000), 15850, 16200));
    g += extrait(540, 560, 1000, 380, '75 120 1000 367', p);
    g += extrait(540, 1010, 820, 300, '75 470 730 255', sortie(prog(t, 16.4, 16.7)));
    if (t >= 17.2) g += `<rect x="${50 + (398 - 75) * .98}" y="${380 + (150 - 120) * .98}" width="${325 * .98}" height="${105 * .98}" fill="none" stroke="${C.rouge}" stroke-width="10" rx="14"/>`;
  } else {                               // le moins de virements possible
    const p = rebond(prog(pose(t * 1000), 18750, 19100));
    g += extrait(540, 700, 860, 600, '1118 126 400 262', p);
    if (t >= 19.6) g += etiquette(540, 1100, '1 SEUL VIREMENT', C.vert, '#fff', 44);
  }
  g += mascotte({x: t < 15.85 ? 540 : 140, y: 1300, s: .55, expr: t < 15.85 ? 'joie' : 'fier', bras: 'montrer'});
  return g;
};
S.S5 = (t, l) => {                       // Affaire classée
  let g = sansCarres(decor(t, 0)).replace(C.rouge, C.jaune) + sol(1300);
  const coup = t >= 21.3 && t < 21.5;
  g += mascotte({x: 300, y: 1300, s: .8, expr: t < 21.3 ? 'neutre' : 'fier', bras: 'bas'});
  g += marteau(470, 1050, coup ? 25 : -45, .9);
  if (t >= 21.3 && t < 22.3) { const p = rebond(prog(t, 21.3, 21.55)); g += `<g transform="translate(540 600) rotate(-10) scale(${p * .85})"><rect x="-380" y="-90" width="760" height="180" fill="none" stroke="${C.rouge}" stroke-width="14"/><text y="34" font-size="96" font-weight="800" text-anchor="middle" fill="${C.rouge}">AFFAIRE CLASSÉE</text></g>`; }
  if (t >= 22.3) {
    g += assiette(540, 640, .8) + croissant(540, 615, .8);
    if (t >= 23.95) { const p = rebond(prog(pose(t * 1000), 23950, 24300)); g += `<g transform="translate(540 340) scale(${p})">${etiquette(0, 0, 'TOURNÉE DE SAMI', C.jaune, C.noir, 60)}</g>`; }
  }
  g += tasse('camille', 650, 1290, .7, Math.sin(pose(l) / 200) * 5) + tasse('sami', 860, 1290, .6, -Math.sin(pose(l) / 200) * 5);
  return g;
};

const scene = document.getElementById('scene'), st = document.getElementById('st'), carton = document.getElementById('carton');
// Sous-titres : une réplique = un sous-titre, calé sur la voix réelle (début, fin + 0,12 s), deux lignes au plus.
const COUPES = { v01: 'Les croissants ont disparu.<br>Qui les a payés ?', v05: 'Le tribunal des colocs<br>est ouvert.', v06: 'Verdict : Sami doit<br>trois cent neuf euros.' };
// Accroche v2 : texte à l'écran dès la première image, lisible sans le son
const ACCROCHE = (tv) => tv < 2.76 ? `<g><rect x="72" y="132" width="936" height="300" fill="${C.noir}" transform="translate(14 14)"/><rect x="72" y="132" width="936" height="300" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><text x="540" y="262" font-size="66" font-weight="800" text-anchor="middle" fill="${C.noir}">Tout le monde a tout payé.</text><text x="540" y="372" font-size="64" font-weight="800" text-anchor="middle" fill="${C.rouge}">Alors, qui doit quoi ?</text></g>` : '';
window.placer = (ms) => {
  const tv = ms / 1000; const t = recaler(tv); ms = t * 1000; window.__t = ms;
  const fin = tv >= T.carton.debut;
  carton.style.display = fin ? 'block' : 'none';
  if (fin) { scene.innerHTML = ''; st.innerHTML = ''; return; }
  const sc = T.scenes.find((s) => t >= s.debut && t < s.fin) || T.scenes[0];
  scene.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${S[sc.id](t, ms - sc.debut * 1000)}${ACCROCHE(tv)}</svg>`;
  const v = T.voix.find((r) => tv >= r.t - .05 && tv < Math.min(r.fin + .12, T.carton.debut));
  st.innerHTML = v ? `<span class="${''}">${COUPES[v.id] || v.texte.replace(/'/g, '’')}</span>` : '';
};
window.placer(0);
</script>
</body>
</html>
