<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L’abonnement fantôme · Mini-story QME</title>
<!-- Projet d'animation de l'épisode. Rendu : node docs/videos/rendu.mjs <ce fichier> 29.6 --muet --taille-max 14
     Toute l'image est fonction du temps : window.placer(ms) dessine l'image exacte de l'instant ms (rendu déterministe).
     Données : timeline.js (généré depuis timeline.json, voix réelles mesurées). -->
<style>
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212;}
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C4;}
:root{--creme:#F1EEE6;--noir:#141414;--jaune:#FFBE00;--jaune-pale:#FBEBC2;--bleu:#23528B;--rouge:#DE2D27;--moutarde:#EDB43A;--vert:#2E7D50}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:'Outfit',sans-serif;color:var(--noir)}
#scene{position:absolute;inset:0}
#st{position:absolute;left:60px;right:130px;top:1350px;display:flex;justify-content:center;text-align:center}
#st span{display:inline;background:var(--jaune-pale);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 22px;border-radius:18px;font-weight:800;font-size:50px;line-height:1.45;letter-spacing:-.5px}
#carton{position:absolute;inset:0;background:#141414;display:none}
#carton img{position:absolute;left:0;width:1080px;top:50%;transform:translateY(-50%)}
.pre{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="st"></div>
<div id="carton"><img src="../assets/qme-carton-final-9x16-official.png" alt=""></div>
<img class="pre" src="../assets/templates-abonnements-tel.webp" alt=""><img class="pre" src="../assets/templates-abonnements-apercu.webp" alt="">
<script src="timeline.js"></script>
<script src="carreau.js"></script>
<script>
const C = {creme:'#F1EEE6', noir:'#141414', jaune:'#FFBE00', pale:'#FBEBC2', bleu:'#23528B', rouge:'#DE2D27', moutarde:'#EDB43A', vert:'#2E7D50', blanc:'#FFFFFF'};
const PAS_POSE = 1000 / 12;              // poses tenues 2 images à 24 i/s : rendu « stop-motion » de la charte MiniStories
const pose = (ms) => Math.floor(ms / PAS_POSE) * PAS_POSE;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (x) => 1 - Math.pow(1 - x, 3);
const rebond = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const euros = (v) => v.toLocaleString('fr-FR').replace(/\u202f|\s/g, '\u2009') + '\u00a0€';
const T = window.TL;
// Temps vidéo -> temps du montage de référence (scènes recalées sur la voix réelle), interpolation linéaire par morceaux.
const recaler = (t) => { const M = T.montage; if (!M) return t; for (let i = 1; i < M.length; i++) if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]); return M[M.length - 1][1] + t - M[M.length - 1][0]; };

// ---------- Mascotte : post-it jaune « A1 » (référence qme-mascot-original-reference.jpeg) ----------
// Une seule fonction pour tout l'épisode : mêmes proportions, couleurs et traits d'un plan à l'autre.
function mascotte({x, y, s = 1, expr = 'neutre', bras = 'bas', rot = 0, ecrase = 1}) {
  // Module officiel docs/templates/communication/formats-test/mascotte/carreau.js (copié sans « export » dans carreau.js)
  const expression = {joie: 'soulage', blase: 'neutre', inquiet: 'inquiet', choc: 'inquiet', panique: 'panique', fier: 'fier', neutre: 'neutre'}[expr];
  const p = {montrer: 'montre', pouce: 'montre', haut: 'court', tete: 'court'}[bras] || 'debout';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s} ${s * ecrase}) translate(-160 -350)">${carreau({expression, pose: p, taille: 320})}</g>`;
}

// ---------- Décor Bauhaus (formes de la charte) ----------
function decor(t, variante = 0) {
  const d = Math.sin(pose(t) / 900) * 6;
  const v = [
    `<circle cx="${-40 + d}" cy="220" r="260" fill="${C.rouge}"/><circle cx="930" cy="420" r="90" fill="${C.noir}"/><rect x="820" y="1100" width="200" height="200" fill="${C.noir}"/><rect x="800" y="1080" width="200" height="200" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/>`,
    `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="120" cy="${1180 + d}" r="70" fill="${C.rouge}"/><path d="M0 1330 h260 l-130 -190z" fill="${C.noir}" opacity=".9"/>`,
    `<circle cx="1000" cy="250" r="200" fill="${C.bleu}"/><rect x="40" y="200" width="120" height="120" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`,
  ][variante];
  return `<rect width="1080" height="1920" fill="${C.creme}"/>${v}`;
}
const sol = (y = 1300) => `<rect x="0" y="${y}" width="1080" height="12" fill="${C.noir}"/>`;

// ---------- Accessoires ----------
const billet = (x, y, r = 0, s = 1) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-70" y="-38" width="140" height="76" rx="6" fill="${C.pale}" stroke="${C.noir}" stroke-width="7"/><circle cx="0" cy="0" r="22" fill="none" stroke="${C.noir}" stroke-width="6"/><text x="0" y="10" font-size="28" font-weight="800" text-anchor="middle">€</text></g>`;
function tas(x, y, n) { let g = ''; for (let i = 0; i < n; i++) g += billet(x + (hash(i) - .5) * 60, y - i * 22, (hash(i + 4) - .5) * 14); return g; }
const piece = (x, y, r = 34) => `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${C.jaune}" stroke="${C.noir}" stroke-width="7"/><text y="${r * .36}" font-size="${r}" font-weight="800" text-anchor="middle">€</text></g>`;
const etiquette = (x, y, txt, fond = C.noir, coul = '#fff', taille = 40) => { const w = txt.length * taille * .64 + 40; return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-taille * .8}" width="${w}" height="${taille * 1.3}" fill="${fond}"/><text y="${taille * .3}" font-size="${taille}" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${coul}">${txt}</text></g>`; };
const compteur = (x, y, v, secousse = 0, couleur = C.noir) => `<g transform="translate(${x + secousse} ${y})"><rect x="-260" y="-70" width="520" height="140" fill="${C.noir}" transform="translate(12 12)"/><rect x="-260" y="-70" width="520" height="140" fill="#fff" stroke="${C.noir}" stroke-width="10"/><text x="-230" y="-32" font-size="26" font-weight="700" letter-spacing="3" fill="#555">SOLDE</text><text x="230" y="46" font-size="84" font-weight="800" text-anchor="end" fill="${couleur}">${euros(v)}</text></g>`;

// Fantômes-abonnements : accessoires (pas des mascottes), forme et couleur fixes dans tout l'épisode.
function fantome(x, y, s = 1, {nom = '', prix = '', rot = 0, bouche = 'o', tampon = ''} = {}) {
  const corps = `<path d="M-80 70 V-10 A80 80 0 0 1 80 -10 V70 l-26.7 -24 l-26.7 24 l-26.6 -24 l-26.7 24 l-26.7 -24 l-26.6 24 z" fill="#fff" stroke="${C.noir}" stroke-width="9" stroke-linejoin="round"/>`;
  const yeux = `<ellipse cx="-28" cy="-12" rx="11" ry="16" fill="${C.noir}"/><ellipse cx="28" cy="-12" rx="11" ry="16" fill="${C.noir}"/>`;
  const b = bouche === 'o' ? `<ellipse cx="0" cy="28" rx="13" ry="17" fill="${C.noir}"/>` : `<path d="M-20 26 q20 14 40 0" fill="none" stroke="${C.noir}" stroke-width="7" stroke-linecap="round"/>`;
  let lab = '';
  if (nom) { const w = Math.max(nom.length, prix.length) * 24 + 40; lab = `<g transform="translate(0 132)"><rect x="${-w / 2}" y="-44" width="${w}" height="${prix ? 96 : 56}" fill="${C.noir}"/><text y="-6" font-size="30" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#fff">${nom}</text>${prix ? `<text y="40" font-size="36" font-weight="800" text-anchor="middle" fill="${C.jaune}">${prix}</text>` : ''}</g>`; }
  const tp = tampon ? `<g transform="translate(0 -6) rotate(-14)"><rect x="-82" y="-26" width="164" height="52" fill="none" stroke="${C.rouge}" stroke-width="7"/><text y="13" font-size="32" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${C.rouge}">${tampon}</text></g>` : '';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">${corps}${yeux}${b}${lab}${tp}</g>`;
}
const flotte = (l, k) => Math.sin(pose(l) / 260 + k * 1.7) * 14;

// Icône d'application de méditation générique (aucune marque) : carré bleu, demi-disques en lotus
const iconeMeditation = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-130" y="-130" width="260" height="260" rx="50" fill="${C.noir}" transform="translate(14 14)"/><rect x="-130" y="-130" width="260" height="260" rx="50" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/><path d="M-80 50 A80 80 0 0 1 80 50 Z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="7"/><circle cx="0" cy="-50" r="34" fill="${C.creme}" stroke="${C.noir}" stroke-width="7"/></g>`;

function telephone(x, y, s, contenu) {
  const W = 700, H = 1300;
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-W / 2} ${-H / 2})"><rect x="16" y="16" width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect x="24" y="24" width="${W - 48}" height="${H - 48}" rx="40" fill="#FAF7F0"/>${contenu}</g>`;
}

// ---------- Scènes ----------
const S = {};
const R = T.reperes;
S.S1 = (t, l) => {                       // Prélèvement : 9,99 € pour méditer
  const notif = rebond(prog(pose(l), 0, 380));
  let g = decor(t, 0) + sol();
  g += `<g transform="translate(540 ${-220 + notif * 640})"><rect x="-400" y="-130" width="800" height="260" rx="36" fill="${C.noir}" transform="translate(12 12)"/><rect x="-400" y="-130" width="800" height="260" rx="36" fill="#fff" stroke="${C.noir}" stroke-width="10"/>
        <text x="-350" y="-58" font-size="32" font-weight="700" letter-spacing="3" fill="#555">PRÉLÈVEMENT · CHAQUE MOIS</text><text x="-350" y="30" font-size="62" font-weight="800">Appli méditation</text><text x="350" y="100" font-size="70" font-weight="800" text-anchor="end" fill="${C.rouge}">−9,99 €</text></g>`;
  const choc = l > 500;
  g += mascotte({x: 540, y: 1300 - (choc && l < 700 ? 40 : 0), s: 1.2, expr: choc ? 'inquiet' : 'neutre', bras: 'bas'});
  return g;
};
S.S2 = (t, l) => {                       // Ouverte une fois, en 2024
  let g = decor(t, 1) + sol();
  g += iconeMeditation(560, 640, 1.2);
  // toile d'araignée dans le coin de l'icône
  g += `<g stroke="${C.noir}" stroke-width="4" fill="none" opacity=".8"><path d="M716 482 L620 482 M716 482 L716 578 M716 482 L640 552"/><path d="M690 482 q-6 20 26 22 M662 482 q-10 42 54 46 M636 482 q-14 66 80 70"/></g>`;
  g += etiquette(540, 1000, 'DERNIÈRE OUVERTURE : 14/03/2024', C.noir, '#fff', 34);
  const puff = prog(t, 5.82, 6.0);
  if (t >= 5.82) for (let i = 0; i < 7; i++) g += `<circle cx="${560 + (hash(i) - .5) * 420 * sortie(puff)}" cy="${640 + (hash(i + 3) - .5) * 300 * sortie(puff)}" r="${20 + hash(i) * 26}" fill="#D8D2C4" opacity="${1 - puff * .6}"/>`;
  g += mascotte({x: 250, y: 1300, s: .9, expr: 'blase', bras: 'bas'});
  return g;
};
S.S3 = (t, l) => {                       // Les fantômes sortent du placard
  let g = decor(t, 2) + sol();
  const ouvert = t >= 7.42;
  const tremble = !ouvert && t > 6.3 ? (hash(pose(l)) - .5) * 18 : 0;
  const px = 600 + tremble, py = 880;
  g += `<rect x="${px - 250}" y="${py - 380}" width="500" height="800" fill="${C.noir}" transform="translate(16 16)"/>`;
  if (!ouvert) {
    g += `<rect x="${px - 250}" y="${py - 380}" width="500" height="800" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="10"/><line x1="${px}" y1="${py - 380}" x2="${px}" y2="${py + 420}" stroke="${C.noir}" stroke-width="10"/><circle cx="${px - 30}" cy="${py + 20}" r="14" fill="${C.noir}"/><circle cx="${px + 30}" cy="${py + 20}" r="14" fill="${C.noir}"/>`;
  } else {
    g += `<rect x="${px - 250}" y="${py - 380}" width="500" height="800" fill="${C.noir}" stroke="${C.noir}" stroke-width="10"/>`;
    g += `<path d="M${px - 250} ${py - 380} L${px - 360} ${py - 330} V${py + 370} L${px - 250} ${py + 420}Z" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="10"/><path d="M${px + 250} ${py - 380} L${px + 330} ${py - 330} V${py + 370} L${px + 250} ${py + 420}Z" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="10"/>`;
  }
  const F = [['STREAMING', '13,99 €', 300, 520], ['SALLE DE SPORT', '39,90 €', 640, 400], ['MAGAZINE', '6,90 €', 820, 760]];
  F.forEach(([nom, prix, x, y], i) => {
    const a = R.fantomes[i]; if (t < a) return;
    const p = sortie(prog(pose(t * 1000), a * 1000, a * 1000 + 350));
    g += fantome(px + (x - px) * p, py + 100 + (y - py - 100) * p + flotte(l, i), .55 + .45 * p, {nom, prix, rot: (hash(i) - .5) * 16});
  });
  const expr = t < 6.3 ? 'blase' : t < R.fantomes[1] ? 'choc' : 'panique';
  g += mascotte({x: 170, y: 1300, s: .8, expr, bras: t < R.fantomes[1] ? 'bas' : 'tete'});
  return g;
};
S.S4 = (t, l) => {                       // 87 € par mois : panique
  const pan = t >= R.panique;
  const tremble = (hash(pose(l)) - .5) * (pan ? 26 : 8);
  let g = `<rect width="1080" height="1920" fill="${pan && Math.floor(l / 330) % 2 ? '#F6D7D0' : C.creme}"/><circle cx="540" cy="560" r="400" fill="${C.rouge}"/>` + sol();
  g += `<g transform="translate(${540 + tremble} 560)"><rect x="-330" y="-120" width="660" height="240" fill="${C.noir}" transform="translate(14 14)"/><rect x="-330" y="-120" width="660" height="240" fill="#fff" stroke="${C.noir}" stroke-width="10"/><text x="-290" y="-62" font-size="30" font-weight="700" letter-spacing="3" fill="#555">ABONNEMENTS · PAR MOIS</text><text x="290" y="80" font-size="130" font-weight="800" text-anchor="end" fill="${C.rouge}">87,00 €</text></g>`;
  for (let i = 0; i < 5; i++) { const ang = pose(l) / 500 + i * 1.2566; g += fantome(540 + Math.cos(ang) * 400, 1010 + Math.sin(ang) * 130, .5, {rot: Math.sin(ang) * 20}); }
  g += mascotte({x: 540 + tremble * .5, y: 1300, s: 1.0, expr: pan ? 'panique' : 'inquiet', bras: pan ? 'tete' : 'bas'});
  return g;
};
S.S5 = (t, l) => {                       // Suivi des abonnements : au mois et à l'année (capture réelle)
  let g = decor(t, 0).replace(C.rouge, C.jaune);
  const ap = rebond(prog(pose(l), 0, 420)), s = .62;
  const capt = `<clipPath id="ecr"><rect x="24" y="24" width="652" height="1252" rx="40"/></clipPath><image href="../assets/templates-abonnements-tel.webp" x="24" y="24" width="652" height="1110" clip-path="url(#ecr)" preserveAspectRatio="xMidYMin slice"/>`;
  g += telephone(560, 720, s * ap, capt);
  const ox = 560 - 350 * s + 24 * s, oy = 720 - 650 * s + 24 * s, k = 652 / 780 * s;
  const cadre = (x, y, w, h) => `<rect x="${ox + x * k}" y="${oy + y * k}" width="${w * k}" height="${h * k}" rx="14" fill="none" stroke="${C.rouge}" stroke-width="10"/>`;
  if (t >= R.cadre_mois) g += cadre(18, 492, 368, 286) + etiquette(ox + 202 * k, oy + 470 * k - 20, 'AU MOIS', C.rouge, '#fff', 30);
  if (t >= R.cadre_an) g += cadre(394, 492, 368, 286) + etiquette(ox + 578 * k, oy + 470 * k - 20, 'À L’ANNÉE', C.rouge, '#fff', 30);
  g += mascotte({x: 150, y: 1300, s: .62, expr: 'fier', bras: 'montrer'});
  return g;
};
S.S6 = (t, l) => {                       // L'alerte arrive avant le prélèvement (capture réelle « À décider »)
  let g = decor(t, 2);
  const p = rebond(prog(pose(l), 0, 380));
  g += `<g transform="translate(540 600) scale(${p})"><rect x="-460" y="-250" width="920" height="500" fill="${C.noir}" transform="translate(14 14)"/><rect x="-460" y="-250" width="920" height="500" fill="#fff" stroke="${C.noir}" stroke-width="10"/>
        <svg x="-450" y="-240" width="900" height="480" viewBox="80 596 782 417" preserveAspectRatio="xMidYMid slice"><image href="../assets/templates-abonnements-apercu.webp" width="1600" height="1000"/></svg></g>`;
  // frise : l'alerte tombe avant le prélèvement
  const y = 1000;
  g += `<rect x="140" y="${y - 6}" width="800" height="12" fill="${C.noir}"/><path d="M940 ${y - 26} l40 26 l-40 26z" fill="${C.noir}"/>`;
  if (t >= R.alerte) { const q = rebond(prog(pose(t * 1000), R.alerte * 1000, R.alerte * 1000 + 300));
    g += `<g transform="translate(330 ${y}) scale(${q})"><circle r="44" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/><path d="M-18 12 h36 l-6 -8 v-14 a12 12 0 0 0 -24 0 v14z" fill="${C.noir}"/><circle cy="20" r="6" fill="${C.noir}"/></g>` + etiquette(330, y + 100, 'ALERTE', C.jaune, C.noir, 32); }
  if (t >= R.prelevement) { const q = rebond(prog(pose(t * 1000), R.prelevement * 1000, R.prelevement * 1000 + 300));
    g += `<g transform="translate(760 ${y}) scale(${q})"><circle r="40" fill="#fff" stroke="${C.noir}" stroke-width="8"/><text y="14" font-size="40" font-weight="800" text-anchor="middle">€</text></g>` + etiquette(760, y + 100, 'PRÉLÈVEMENT', C.noir, '#fff', 30); }
  g += mascotte({x: 150, y: 1300, s: .55, expr: t >= R.alerte ? 'fier' : 'neutre', bras: 'montrer'});
  return g;
};
S.S7 = (t, l) => {                       // Payoff : Caro médite… gratuitement
  let g = decor(t, 1) + sol();
  g += `<circle cx="540" cy="760" r="300" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`;
  const lev = Math.sin(pose(l) / 400) * 18;
  [['STREAMING', 170, 1150], ['SPORT', 910, 1150], ['MAGAZINE', 180, 470], ['MÉDITATION', 900, 470]].forEach(([nom, x, y], i) => {
    g += fantome(x, y + flotte(l, i) * .5, .55, {bouche: 'sourire', tampon: 'RÉSILIÉ'});
  });
  g += mascotte({x: 540, y: 1180 + lev, s: 1.05, expr: t >= 24.95 ? 'fier' : 'joie', bras: 'bas'});
  return g;
};

const scene = document.getElementById('scene'), st = document.getElementById('st'), carton = document.getElementById('carton');
// Sous-titres : une réplique = un sous-titre, calé sur la voix réelle (début, fin + 0,12 s), deux lignes au plus.
const COUPES = { v04: 'Le streaming oublié. La salle<br>de sport. Le magazine.', v05: '87\u00a0€ par mois.<br>De fantômes.', v06: 'Le Suivi des abonnements, de QME,<br>ramène tout au mois et à l’année.', v07: 'Un essai qui se termine ? L’alerte<br>arrive avant le prélèvement.', v01: '9,99\u00a0€.<br>Pour méditer.' };
window.placer = (ms) => {
  const tv = ms / 1000; const t = recaler(tv); ms = t * 1000; window.__t = ms;
  const fin = tv >= T.carton.debut;
  carton.style.display = fin ? 'block' : 'none';
  if (fin) { scene.innerHTML = ''; st.innerHTML = ''; return; }
  const sc = T.scenes.find((s) => t >= s.debut && t < s.fin) || T.scenes[0];
  scene.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${S[sc.id](t, ms - sc.debut * 1000)}</svg>`;
  const v = T.voix.find((r) => tv >= r.t - .05 && tv < Math.min(r.fin + .12, T.carton.debut));
  st.innerHTML = v ? `<span>${COUPES[v.id] || v.texte.replace(/'/g, '’')}</span>` : '';
};
window.placer(0);
</script>
</body>
</html>
