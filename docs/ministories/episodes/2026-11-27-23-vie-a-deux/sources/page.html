<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vie à deux · Mini-story QME</title>
<!-- Projet d'animation de l'épisode. Rendu : node docs/videos/rendu.mjs <ce fichier> 30 --muet --taille-max 14
     Toute l'image est fonction du temps : window.placer(ms) dessine l'image exacte de l'instant ms (rendu déterministe).
     Données : timeline.js (généré depuis timeline.json, voix réelles mesurées). -->
<style>
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212;}
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C4;}
:root{--creme:#F1EEE6;--noir:#141414;--jaune:#FFBE00;--jaune-pale:#FBEBC2;--bleu:#23528B;--rouge:#DE2D27;--moutarde:#EDB43A;--vert:#2E7D50}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:'Outfit',sans-serif;color:var(--noir)}
#scene{position:absolute;inset:0}
#st{position:absolute;left:60px;right:130px;top:1350px;display:flex;justify-content:center;text-align:center}
#st span{display:inline;background:var(--jaune-pale);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 22px;border-radius:18px;font-weight:800;font-size:56px;line-height:1.45;letter-spacing:-.5px}
#carton{position:absolute;inset:0;background:#141414;display:none}
#carton img{position:absolute;left:0;width:1080px;top:50%;transform:translateY(-50%)}
.pre{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="st"></div>
<div id="carton"><img src="../assets/qme-carton-final-9x16-official.png" alt=""></div>
<img class="pre" src="../assets/templates-budget-commun-tel.webp" alt=""><img class="pre" src="../assets/templates-demenagement-tel.webp" alt=""><img class="pre" src="../assets/templates-voyage-tel.webp" alt=""><img class="pre" src="../assets/templates-remerciements-tel.webp" alt=""><img class="pre" src="../assets/templates-budget-tel.webp" alt=""><img class="pre" src="../assets/templates-evenementiel-tables.webp" alt="">
<script src="timeline.js"></script>
<script src="carreau.js"></script>
<script>
const C = {creme:'#F1EEE6', noir:'#141414', jaune:'#FFBE00', pale:'#FBEBC2', bleu:'#23528B', rouge:'#DE2D27', moutarde:'#EDB43A', vert:'#2E7D50', blanc:'#FFFFFF'};
const PAS_POSE = 1000 / 12;              // poses tenues 2 images à 24 i/s : rendu « stop-motion » de la charte MiniStories
const pose = (ms) => Math.floor(ms / PAS_POSE) * PAS_POSE;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (x) => 1 - Math.pow(1 - x, 3);
const rebond = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const euros = (v) => v.toLocaleString('fr-FR').replace(/\u202f|\s/g, '\u2009') + '\u00a0€';
const T = window.TL;
// Temps vidéo -> temps du montage de référence (scènes recalées sur la voix réelle), interpolation linéaire par morceaux.
const recaler = (t) => { const M = T.montage; if (!M) return t; for (let i = 1; i < M.length; i++) if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]); return M[M.length - 1][1] + t - M[M.length - 1][0]; };


// ---------- Mascotte (module officiel carreau.js, sans accessoire) ----------
function mascotte({x, y, s = 1, expr = 'neutre', bras = 'bas', rot = 0}) {
  const expression = {joie: 'soulage', blase: 'neutre', inquiet: 'inquiet', choc: 'inquiet', panique: 'panique', fier: 'fier', neutre: 'neutre'}[expr];
  const p = {montrer: 'montre', haut: 'court'}[bras] || 'debout';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s}) translate(-160 -350)">${carreau({expression, pose: p, taille: 320})}</g>`;
}
const etiquette = (x, y, txt, fond = C.noir, coul = '#fff', taille = 40) => { const w = txt.length * taille * .64 + 40; return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-taille * .8}" width="${w}" height="${taille * 1.3}" fill="${fond}"/><text y="${taille * .3}" font-size="${taille}" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${coul}">${txt}</text></g>`; };
const fond = (ciel = C.creme) => `<rect width="1080" height="1920" fill="${ciel}"/>`;
// Route : bande noire, tirets crème qui défilent (vitesse v en px/s)
function route(t, v = 600, y = 1180) { let g = `<rect x="0" y="${y}" width="1080" height="130" fill="${C.noir}"/>`; const o = (pose(t * 1000) / 1000 * v) % 220; for (let x = -220; x < 1300; x += 220) g += `<rect x="${x - o}" y="${y + 58}" width="120" height="14" fill="${C.creme}"/>`; return g; }
// Van aménagé Bauhaus : grande caisse haute, avant court, fenêtres, roues noires. Aucune marque.
// inter(x0,y0) : contenu dessiné derrière la grande fenêtre (repère du van).
function van(x, y, s = 1, saut = 0, inter = '') {
  const r = (cx) => `<circle cx="${cx}" cy="0" r="58" fill="${C.noir}"/><circle cx="${cx}" cy="0" r="20" fill="${C.creme}"/>`;
  return `<g transform="translate(${x} ${y - saut}) scale(${s})">
    <rect x="-300" y="-390" width="600" height="340" fill="${C.noir}" transform="translate(12 12)"/>
    <path d="M-300 -390 H170 L300 -230 V-50 H-300 Z" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/>
    <rect x="-300" y="-170" width="600" height="40" fill="${C.creme}" stroke="${C.noir}" stroke-width="8"/>
    <clipPath id="fen"><rect x="-250" y="-340" width="260" height="140"/></clipPath>
    <rect x="-250" y="-340" width="260" height="140" fill="${C.pale}" stroke="${C.noir}" stroke-width="8"/>
    <g clip-path="url(#fen)">${inter}</g>
    <rect x="-250" y="-340" width="260" height="140" fill="none" stroke="${C.noir}" stroke-width="8"/>
    <path d="M60 -340 H160 L250 -230 H60 Z" fill="${C.pale}" stroke="${C.noir}" stroke-width="8"/>
    <rect x="270" y="-110" width="30" height="30" fill="${C.jaune}" stroke="${C.noir}" stroke-width="6"/>
    ${r(-180)}${r(170)}</g>`;
}
const panneau = (x, y, txt, fondc = '#fff', s = 1) => { const w = Math.max(260, txt.length * 34 + 60); return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-8" y="0" width="16" height="260" fill="${C.noir}"/><rect x="${-w / 2}" y="-110" width="${w}" height="110" fill="${fondc}" stroke="${C.noir}" stroke-width="9"/><text y="-38" font-size="50" font-weight="800" text-anchor="middle">${txt}</text></g>`; };
// Carte routière : papier plié en 3 volets, routes rouges
const carte = (x, y, r, s = 1) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-150" y="-100" width="300" height="200" fill="${C.pale}" stroke="${C.noir}" stroke-width="8"/><path d="M-50 -100 V100 M50 -100 V100" stroke="${C.noir}" stroke-width="5"/><path d="M-130 60 Q-60 -60 10 20 T130 -60" fill="none" stroke="${C.rouge}" stroke-width="10"/><circle cx="-130" cy="60" r="12" fill="${C.bleu}"/></g>`;
// Capture réelle recadrée dans un cadre à ombre pleine (vb = zone de l'image 1600 × 1000)
function cadre(x, y, w, h, img, vb, s = 1, bord = C.noir) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${C.noir}" transform="translate(14 14)"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="#fff" stroke="${bord}" stroke-width="10"/>
    <svg x="${-w / 2 + 10}" y="${-h / 2 + 10}" width="${w - 20}" height="${h - 20}" viewBox="${vb}" preserveAspectRatio="xMidYMid slice"><image href="../assets/${img}" width="1600" height="1000"/></svg></g>`;
}
const pop = (t, a, d = 300) => rebond(prog(pose(t * 1000), a * 1000, a * 1000 + d));
const lune = (x, y, r = 90) => `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/><circle cx="${r * .45}" cy="${-r * .25}" r="${r * .85}" fill="${C.bleu}"/></g>`;
const lit = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-120" y="-40" width="240" height="60" fill="#fff" stroke="${C.noir}" stroke-width="8"/><rect x="-110" y="-80" width="80" height="44" fill="${C.pale}" stroke="${C.noir}" stroke-width="7"/><rect x="-130" y="-100" width="20" height="150" fill="${C.noir}"/><rect x="110" y="-60" width="20" height="110" fill="${C.noir}"/></g>`;


// Partenaire : cercle bleu Bauhaus, sans visage (aucune seconde mascotte, couple non genré)
const partenaire = (x, y, s = 1, saut = 0) => `<g transform="translate(${x} ${y - saut}) scale(${s})"><circle cx="10" cy="-140" r="130" fill="${C.noir}"/><circle cy="-150" r="130" fill="${C.bleu}" stroke="${C.noir}" stroke-width="9"/></g>`;
// Cœur géométrique : carré tourné + deux disques ; fendu si f > 0 (écart des deux moitiés)
function coeur(x, y, s = 1, f = 0) {
  const moitie = (sg) => `<g transform="translate(${sg * f} 0)"><clipPath id="h${sg > 0 ? 'd' : 'g'}"><rect x="${sg > 0 ? 0 : -200}" y="-200" width="200" height="400"/></clipPath><g clip-path="url(#h${sg > 0 ? 'd' : 'g'})"><rect x="-70" y="-70" width="140" height="140" transform="rotate(45)" fill="${C.rouge}" stroke="${C.noir}" stroke-width="8"/><circle cx="-50" cy="-50" r="70" fill="${C.rouge}" stroke="${C.noir}" stroke-width="8"/><circle cx="50" cy="-50" r="70" fill="${C.rouge}" stroke="${C.noir}" stroke-width="8"/><rect x="-60" y="-60" width="120" height="90" fill="${C.rouge}"/></g></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">${moitie(-1)}${moitie(1)}</g>`;
}
const ticket = (x, y, txt, r = 0, s = 1, fondc = '#fff') => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-170" y="-70" width="340" height="140" fill="${C.noir}" transform="translate(10 10)"/><rect x="-170" y="-70" width="340" height="140" fill="${fondc}" stroke="${C.noir}" stroke-width="8"/><text y="20" font-size="58" font-weight="800" text-anchor="middle">${txt}</text></g>`;
const fleche = (x, y, sens = 1, coul = C.rouge) => `<g transform="translate(${x} ${y}) scale(${sens} 1)"><path d="M-70 -18 H30 V-50 L80 0 L30 50 V18 H-70 Z" fill="${coul}" stroke="${C.noir}" stroke-width="6"/></g>`;
const duo = (t, l, expr = 'neutre', bras = 'bas', y = 1290) => mascotte({x: 300, y, s: .8, expr, bras}) + partenaire(790, y - 20, .95, Math.abs(Math.sin(pose(l) / 160)) * 10);
function telephone(x, y, s, img) { const W = 700, H = 1300; return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-W / 2} ${-H / 2})"><rect x="16" y="16" width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect width="${W}" height="${H}" rx="60" fill="${C.noir}"/><clipPath id="e${img.length}"><rect x="24" y="24" width="652" height="1252" rx="40"/></clipPath><rect x="24" y="24" width="652" height="1252" rx="40" fill="#FAF7F0"/><image href="../assets/${img}" x="24" y="24" width="652" height="1110" clip-path="url(#e${img.length})" preserveAspectRatio="xMidYMin slice"/></g>`; }
const cle = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><circle r="60" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle r="20" fill="${C.creme}" stroke="${C.noir}" stroke-width="8"/><rect x="55" y="-16" width="170" height="32" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/><rect x="170" y="10" width="26" height="44" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/><rect x="120" y="10" width="26" height="34" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8"/></g>`;

const S = {};
S.S1 = (t, l) => {                       // On s'installe à deux
  let g = fond() + `<circle cx="960" cy="330" r="150" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><rect x="0" y="1290" width="1080" height="630" fill="${C.pale}"/><rect x="60" y="1100" width="960" height="190" fill="${C.rouge}" stroke="${C.noir}" stroke-width="10"/>`;
  g += coeur(545, 700, 1.3 * pop(t, .25, 350));
  g += etiquette(540, 330, 'À DEUX', C.noir, '#fff', 80);
  g += duo(t, l, 'joie', 'bas', 1200);
  return g;
};
S.S2 = (t, l) => {                       // Le camion : le ticket fait le ping-pong
  let g = fond() + `<path d="M0 0 h380 a380 380 0 0 1 -380 380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`;
  // camion Bauhaus avec cartons
  g += `<g transform="translate(540 760)"><rect x="-330" y="-230" width="440" height="280" fill="#fff" stroke="${C.noir}" stroke-width="10"/><rect x="-300" y="-110" width="120" height="110" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="7"/><rect x="-170" y="-110" width="120" height="110" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="7"/><rect x="-240" y="-200" width="120" height="90" fill="${C.moutarde}" stroke="${C.noir}" stroke-width="7"/><path d="M110 -150 H250 L330 -50 V50 H110 Z" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/><circle cx="-220" cy="60" r="55" fill="${C.noir}"/><circle cx="220" cy="60" r="55" fill="${C.noir}"/></g>`;
  const k = Math.floor((t - 1.5) / .55), ph = ((t - 1.5) / .55) % 1, va = k % 2 ? 1 : -1;
  const xt = 540 + va * (sortie(ph) * 2 - 1) * 230;
  g += ticket(xt, 930, 'CAMION ?', va * 8, .9, C.pale);
  g += duo(t, l, t < 3.0 ? 'inquiet' : 'choc', 'bas');
  return g;
};
S.S3 = (t, l) => {                       // Le voyage : les tickets s'empilent
  let g = fond() + `<circle cx="1000" cy="270" r="200" fill="${C.bleu}"/>`;
  // valise
  g += `<g transform="translate(540 560)"><rect x="-80" y="-170" width="160" height="70" fill="none" stroke="${C.noir}" stroke-width="18"/><rect x="-220" y="-110" width="440" height="300" fill="${C.rouge}" stroke="${C.noir}" stroke-width="10"/><rect x="-120" y="-110" width="30" height="300" fill="${C.noir}"/><rect x="90" y="-110" width="30" height="300" fill="${C.noir}"/></g>`;
  const T3 = [[4.3, 'TRAIN', -8], [4.65, 'HÔTEL', 6], [5.0, 'MUSÉE', -4], [5.35, 'QUI ?', 3]];
  T3.forEach(([a, x, r], i) => { if (t >= a) g += ticket(540 + (i % 2 ? 60 : -60), 1040 - i * 60, x, r, .85 * pop(t, a, 250), i === 3 ? C.jaune : '#fff'); });
  g += mascotte({x: 140, y: 1310, s: .55, expr: 'inquiet'}) + partenaire(950, 1300, .6);
  return g;
};
S.S4 = (t, l) => {                       // Le grand jour : 120 invités, qui paie ?
  let g = fond() + `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`;
  const n = Math.round(120 * sortie(prog(t, 6.3, 7.95)));
  for (let i = 0; i < n; i++) { const c = i % 12, r = Math.floor(i / 12); g += `<circle cx="${150 + c * 70}" cy="${520 + r * 52}" r="22" fill="${[C.bleu, C.rouge, C.jaune, C.noir][i % 4]}"/>`; }
  g += etiquette(540, 340, n + ' INVITÉS', C.noir, '#fff', 80);
  if (t >= 8.35) g += `<g transform="translate(540 1110) scale(${pop(t, 8.35)})">${etiquette(0, 0, 'QUI PAIE ?', C.rouge, '#fff', 90)}</g>`;
  g += mascotte({x: 150, y: 1330, s: .5, expr: t < 8.35 ? 'inquiet' : 'panique', bras: t < 8.35 ? 'bas' : 'haut'});
  return g;
};
S.S5 = (t, l) => {                       // Les cadeaux à remercier
  let g = fond() + `<circle cx="110" cy="300" r="90" fill="${C.rouge}"/>`;
  const cad = (x, y, w, h, c) => `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" fill="${c}" stroke="${C.noir}" stroke-width="9"/><rect x="-14" y="${-h}" width="28" height="${h}" fill="${C.noir}"/><rect x="${-w / 2 - 15}" y="${-h - 40}" width="${w + 30}" height="40" fill="${c}" stroke="${C.noir}" stroke-width="9"/></g>`;
  const P = [[400, 1100, 300, 220, C.jaune], [700, 1100, 260, 260, C.bleu], [550, 840, 240, 180, C.rouge], [520, 620, 180, 140, '#fff'], [720, 800, 160, 120, C.jaune]];
  P.forEach((p, i) => { const a = 9.3 + i * .22; if (t >= a) { const d = 1 - sortie(prog(t, a, a + .25)); g += cad(p[0], p[1] - d * 600, p[2], p[3], p[4]); } });
  if (t >= 10.3) g += `<g transform="translate(540 330) scale(${pop(t, 10.3)})">${etiquette(0, 0, 'MERCI : 0 / 47', C.noir, '#fff', 66)}</g>`;
  g += mascotte({x: 150, y: 1330, s: .5, expr: 'choc', bras: 'haut'});
  return g;
};
S.S6 = (t, l) => {                       // Le budget du mois : Carreau vire au rouge, le cœur se fend
  let g = fond(C.pale);
  const f = 40 * sortie(prog(t, 12.0, 12.4));
  g += coeur(540, 520, 1.2, f);
  for (let i = 0; i < 7; i++) { const a = 11.5 + i * .14, q = prog(t, a, a + .7); if (q > 0) g += `<text x="${140 + i * 130}" y="${230 + q * 700}" font-size="90" font-weight="800" fill="${C.rouge}" opacity="${1 - q * .5}">€</text>`; }
  const tr = t >= 12.0 ? (hash(Math.floor(pose(l) / 83)) - .5) * 24 : 0;
  g += mascotte({x: 540 + tr, y: 1290, s: .85, expr: t < 12.0 ? 'inquiet' : 'panique', bras: 'haut'});
  return g;
};
S.S7 = (t, l) => {                       // Bascule : Pack Vie à deux, les outils en éventail
  let g = fond() + `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="110" cy="300" r="70" fill="${C.rouge}"/>`;
  g += `<g transform="translate(540 320) scale(${pop(t, 13.3)})">${etiquette(0, 0, 'PACK VIE À DEUX', C.noir, '#fff', 70)}</g>`;
  const I = ['demenagement-tel', 'voyage-tel', 'remerciements-tel', 'budget-tel', 'budget-commun-tel'];
  I.forEach((k, i) => { const a = 13.5 + i * .28, p = sortie(prog(t, a, a + .3)); if (p > 0) g += `<g transform="rotate(${(i - 2) * 9 * p} 540 1500)">${telephone(540, 860, .62 * (.6 + .4 * p), 'templates-' + k + '.webp')}</g>`; });
  g += etiquette(540, 1240, '6 OUTILS', C.rouge, '#fff', 60);
  return g;
};
S.S8 = (t, l) => {                       // Un outil par étape, une seule clé : captures en rafale
  let g = fond() + `<circle cx="1000" cy="270" r="200" fill="${C.bleu}"/>`;
  const R = [[15.6, 'demenagement-tel', 'DÉMÉNAGEMENT'], [16.05, 'voyage-tel', 'VOYAGE'], [16.5, 'evenementiel-tables', 'GRAND JOUR'], [16.95, 'remerciements-tel', 'MERCI'], [17.4, 'budget-tel', 'BUDGET']];
  let cur = R[0]; for (const r of R) if (t >= r[0]) cur = r;
  const s = pop(t, cur[0], 200);
  if (cur[1] === 'evenementiel-tables') g += cadre(540, 790, 1000, 880, 'templates-evenementiel-tables.webp', '568 330 820 720', s);
  else g += telephone(560, 850, .74 * s, 'templates-' + cur[1] + '.webp');
  g += etiquette(540, 300, cur[2], C.noir, '#fff', 60);
  g += cle(150, 1270, .55 * pop(t, 16.6));
  return g;
};
S.S9 = (t, l) => {                       // Qui doit quoi, calculé (Gestion Dépenses Communes, capture réelle)
  let g = fond() + `<path d="M0 0 h380 a380 380 0 0 1 -380 380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`;
  g += etiquette(560, 290, 'QUI DOIT QUOI', C.noir, '#fff', 66);
  g += `<g transform="translate(540 760) scale(${pop(t, 17.9, 350)})"><rect x="-500" y="-330" width="1000" height="660" fill="${C.noir}" transform="translate(14 14)"/><rect x="-500" y="-330" width="1000" height="660" fill="#fff" stroke="${C.noir}" stroke-width="10"/><svg x="-490" y="-320" width="980" height="640" viewBox="0 70 780 510" preserveAspectRatio="xMidYMid meet"><image href="../assets/templates-budget-commun-tel.webp" width="780" height="1328"/></svg></g>`;
  if (t >= 18.6) g += `<g transform="translate(860 1170) scale(${pop(t, 18.6)})">${etiquette(0, 0, 'CALCULÉ', C.vert, '#fff', 56)}</g>`;
  g += mascotte({x: 150, y: 1330, s: .5, expr: 'fier', bras: 'montrer'});
  return g;
};
S.S10 = (t, l) => {                      // Payoff : au resto, la seule dispute qui reste
  let g = fond() + `<circle cx="960" cy="330" r="150" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`;
  g += `<rect x="60" y="1120" width="960" height="40" fill="${C.noir}"/><rect x="140" y="1160" width="30" height="200" fill="${C.noir}"/><rect x="910" y="1160" width="30" height="200" fill="${C.noir}"/>`;
  // carte du resto qui passe d'un côté à l'autre
