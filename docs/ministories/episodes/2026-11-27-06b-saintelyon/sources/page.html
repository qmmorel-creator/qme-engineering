<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La SaintéLyon de la veille · Mini-story QME</title>
<!-- Projet d'animation de l'épisode. Rendu : node docs/videos/rendu.mjs <ce fichier> 29.2 --muet --taille-max 14
     Toute l'image est fonction du temps : window.placer(ms) dessine l'image exacte de l'instant ms (rendu déterministe).
     Données : timeline.js (généré depuis timeline.json, voix réelles mesurées). -->
<style>
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212;}
@font-face{font-family:'Outfit';font-weight:400 800;src:url('../assets/outfit-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C4;}
:root{--creme:#F1EEE6;--noir:#141414;--jaune:#FFBE00;--jaune-pale:#FBEBC2;--bleu:#23528B;--rouge:#DE2D27;--moutarde:#EDB43A;--vert:#2E7D50}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:'Outfit',sans-serif;color:var(--noir)}
#scene{position:absolute;inset:0}
#st{position:absolute;left:60px;right:130px;top:1350px;display:flex;justify-content:center;text-align:center}
#st span{display:inline;background:var(--jaune-pale);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 22px;border-radius:18px;font-weight:800;font-size:56px;line-height:1.45;letter-spacing:-.5px}
#carton{position:absolute;inset:0;background:#141414;display:none}
#carton img{position:absolute;left:0;width:1080px;top:50%;transform:translateY(-50%)}
.pre{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="st"></div>
<div id="carton"><img src="../assets/qme-carton-final-9x16-official.png" alt=""></div>
<img class="pre" src="../assets/templates-course-a-pied-tel-allures.webp" alt=""><img class="pre" src="../assets/templates-course-a-pied-plan.webp" alt="">
<script src="timeline.js"></script>
<script src="carreau.js"></script>
<script>
const C = {creme:'#F1EEE6', noir:'#141414', jaune:'#FFBE00', pale:'#FBEBC2', bleu:'#23528B', rouge:'#DE2D27', moutarde:'#EDB43A', vert:'#2E7D50', blanc:'#FFFFFF'};
const PAS_POSE = 1000 / 12;              // poses tenues 2 images à 24 i/s : rendu « stop-motion » de la charte MiniStories
const pose = (ms) => Math.floor(ms / PAS_POSE) * PAS_POSE;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (x) => 1 - Math.pow(1 - x, 3);
const rebond = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const euros = (v) => v.toLocaleString('fr-FR').replace(/\u202f|\s/g, '\u2009') + '\u00a0€';
const T = window.TL;
// Temps vidéo -> temps du montage de référence (scènes recalées sur la voix réelle), interpolation linéaire par morceaux.
const recaler = (t) => { const M = T.montage; if (!M) return t; for (let i = 1; i < M.length; i++) if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]); return M[M.length - 1][1] + t - M[M.length - 1][0]; };

// ---------- Mascotte : post-it jaune « A1 » (référence qme-mascot-original-reference.jpeg) ----------
// Une seule fonction pour tout l'épisode : mêmes proportions, couleurs et traits d'un plan à l'autre.
// Tenue temporaire « course de nuit » (validée par Quentin) : reprise exacte de docs/ministories/carreau-chasuble-source.html,
// posée PAR-DESSUS le module officiel (non modifié) : frontale (bandeau bleu, lampe, faisceau) et dossard « SAINTÉLYON » n° 36.
function course(svg, {num = '36', lampe = true, incl = 0} = {}) {
  const P = PALETTE;
  const acc = `<g transform="rotate(${incl} 160 150)">
   ${lampe ? `<path d="M156 26 L-30 -190 L342 -190 Z" fill="#FFF6C8" opacity=".5"/><path d="M156 26 L70 -190 L242 -190 Z" fill="#FFFBE3" opacity=".75"/>` : ''}
   <rect x="52" y="26" width="208" height="14" fill="${P.bleu}" stroke="${P.encre}" stroke-width="5"/>
   ${lampe ? `<rect x="122" y="4" width="68" height="50" rx="10" fill="${P.encre}"/><circle cx="156" cy="29" r="18" fill="#fff"/><circle cx="156" cy="29" r="13" fill="${P.jaune}"/>` : ''}
   <g transform="translate(156 262)"><rect x="-66" y="-30" width="132" height="78" fill="#fff" stroke="${P.encre}" stroke-width="6"/>
    <rect x="-66" y="-30" width="132" height="22" fill="${P.bleu}"/><text y="-13" font-family="Outfit" font-weight="800" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="2">SAINTÉLYON</text>
    <text y="36" font-family="Outfit" font-weight="800" font-size="40" fill="${P.encre}" text-anchor="middle">${num}</text>
    ${[-54, 54].map((x) => `<circle cx="${x}" cy="0" r="4" fill="${P.encre}"/>`).join('')}</g></g>`;
  return svg.replace('<svg ', '<svg style="overflow:visible" ').replace('</svg>', acc + '</svg>');
}
function mascotte({x, y, s = 1, expr = 'neutre', bras = 'bas', rot = 0, ecrase = 1, tenue = null}) {
  // Module officiel docs/templates/communication/formats-test/mascotte/carreau.js (copié sans « export » dans carreau.js)
  const expression = {joie: 'soulage', blase: 'neutre', inquiet: 'inquiet', choc: 'inquiet', panique: 'panique', fier: 'fier', neutre: 'neutre'}[expr];
  const p = {montrer: 'montre', pouce: 'montre', haut: 'court', tete: 'court'}[bras] || 'debout';
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s} ${s * ecrase}) translate(-160 -350)">${tenue ? course(carreau({expression, pose: p, taille: 320}), tenue) : carreau({expression, pose: p, taille: 320})}</g>`;
}

// ---------- Décor Bauhaus (formes de la charte) ----------
function decor(t, variante = 0) {
  const d = Math.sin(pose(t) / 900) * 6;
  const v = [
    `<circle cx="${-40 + d}" cy="220" r="260" fill="${C.rouge}"/><circle cx="930" cy="420" r="90" fill="${C.noir}"/><rect x="820" y="1100" width="200" height="200" fill="${C.noir}"/><rect x="800" y="1080" width="200" height="200" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/>`,
    `<path d="M1080 0 v380 a380 380 0 0 1 -380 -380z" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><circle cx="120" cy="${1180 + d}" r="70" fill="${C.rouge}"/><path d="M0 1330 h260 l-130 -190z" fill="${C.noir}" opacity=".9"/>`,
    `<circle cx="1000" cy="250" r="200" fill="${C.bleu}"/><rect x="40" y="200" width="120" height="120" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/>`,
  ][variante];
  return `<rect width="1080" height="1920" fill="${C.creme}"/>${v}`;
}
const sol = (y = 1300) => `<rect x="0" y="${y}" width="1080" height="12" fill="${C.noir}"/>`;

// ---------- Accessoires (formes et couleurs fixes pour tout l'épisode) ----------
const etiquette = (x, y, txt, fond = C.noir, coul = '#fff', taille = 40) => { const w = txt.length * taille * .64 + 40; return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-taille * .8}" width="${w}" height="${taille * 1.3}" fill="${fond}"/><text y="${taille * .3}" font-size="${taille}" font-weight="800" letter-spacing="2" text-anchor="middle" fill="${coul}">${txt}</text></g>`; };
// Dossard « 10 KM » (blanc, bande rouge, épingles noires)
const dossard = (x, y, s = 1, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-190" y="-130" width="380" height="260" fill="${C.noir}" transform="translate(12 12)"/><rect x="-190" y="-130" width="380" height="260" fill="#fff" stroke="${C.noir}" stroke-width="10"/><rect x="-190" y="-130" width="380" height="60" fill="${C.rouge}" stroke="${C.noir}" stroke-width="10"/><circle cx="-160" cy="-100" r="9" fill="${C.noir}"/><circle cx="160" cy="-100" r="9" fill="${C.noir}"/><text y="70" font-size="128" font-weight="800" text-anchor="middle">10 KM</text></g>`;
// Case de calendrier (en-tête rouge)
const calendrier = (x, y, haut, gros, s = 1, r = 0, fondGros = '#fff') => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-180" y="-190" width="360" height="380" fill="${C.noir}" transform="translate(14 14)"/><rect x="-180" y="-190" width="360" height="380" fill="${fondGros}" stroke="${C.noir}" stroke-width="10"/><rect x="-180" y="-190" width="360" height="90" fill="${C.rouge}" stroke="${C.noir}" stroke-width="10"/><text y="-128" font-size="44" font-weight="800" text-anchor="middle" fill="#fff" letter-spacing="5">${haut}</text><text y="${gros.length > 4 ? 80 : 110}" font-size="${gros.length > 4 ? 100 : 170}" font-weight="800" text-anchor="middle">${gros}</text></g>`;
// Arche de course (DÉPART / ARRIVÉE), damier noir et blanc
function arche(txt, ruban = false, casse = 0) {
  let d = ''; for (let i = 0; i < 18; i++) d += `<rect x="${140 + i * 44}" y="${i % 2 ? 470 : 448}" width="22" height="22" fill="${C.noir}"/>`;
  let g = `<rect x="110" y="420" width="40" height="890" fill="${C.noir}"/><rect x="930" y="420" width="40" height="890" fill="${C.noir}"/><rect x="110" y="300" width="860" height="200" fill="${C.bleu}" stroke="${C.noir}" stroke-width="10"/><text x="540" y="430" font-size="104" font-weight="800" text-anchor="middle" fill="#fff" letter-spacing="8">${txt}</text>`;
  if (ruban) g += casse ? `<path d="M150 1050 L${150 + 300 * (1 - casse)} ${1050 + casse * 160}" stroke="${C.rouge}" stroke-width="18"/><path d="M930 1050 L${930 - 300 * (1 - casse)} ${1050 + casse * 160}" stroke="${C.rouge}" stroke-width="18"/>` : `<rect x="150" y="1041" width="780" height="18" fill="${C.rouge}"/>`;
  return g;
}
// Assiette de pâtes
const assiette = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="170" ry="44" fill="#fff" stroke="${C.noir}" stroke-width="9"/><path d="M-110 -10 q30 -70 60 0 q30 -70 60 0 q30 -70 60 0 q20 -40 40 0" fill="${C.jaune}" stroke="${C.noir}" stroke-width="8" stroke-linejoin="round"/></g>`;
// Gouttes de sueur
const sueur = (x, y, l, n = 3) => { let g = ''; for (let i = 0; i < n; i++) { const q = ((pose(l) / 500) + i / n) % 1; g += `<path d="M${x + (i - 1) * 70} ${y + q * 90} q-16 26 0 36 q16 -10 0 -36z" fill="${C.bleu}" stroke="${C.noir}" stroke-width="4" opacity="${1 - q}"/>`; } return g; };
// Téléphone avec une vraie capture du Plan d'entraînement course à pied (780 × 1328)
function telephone(x, y, s, contenu) {
  const W = 700, H = 1300;
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-W / 2} ${-H / 2})"><rect x="16" y="16" width="${W}" height="${H}" fill="${C.noir}" rx="60"/><rect width="${W}" height="${H}" rx="60" fill="${C.noir}"/><rect x="24" y="24" width="${W - 48}" height="${H - 48}" rx="40" fill="#FAF7F0"/>${contenu}</g>`;
}
const coche = (x, y, p) => `<g transform="translate(${x} ${y}) scale(${p})"><circle r="34" fill="${C.vert}" stroke="${C.noir}" stroke-width="6"/><path d="M-15 1 l10 11 l20 -22" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>`;

// ---------- Scènes ----------
const NUIT = '#1B2A4A';
const flocons = (l, n = 14) => { let g = ''; for (let i = 0; i < n; i++) { const y = ((hash(i + 3) * 1700 + pose(l) * .25) % 1500) + 230; g += `<circle cx="${(hash(i) * 1080 + Math.sin(pose(l) / 400 + i) * 20).toFixed(0)}" cy="${y.toFixed(0)}" r="${7 + hash(i + 5) * 6}" fill="#fff" opacity=".85"/>`; } return g; };
const S = {};
S.S1 = (t, l) => {                       // Inscrit à la SaintéLyon… c'est cette nuit
  const choc = t >= 2.75;                // « … cette nuit »
  let g = decor(t, 0) + sol();
  const saut = t < 1.85 ? Math.abs(Math.sin(pose(l) / 170)) * 60 : 0;
  if (t >= 2.0) { const p = rebond(prog(pose(l), 2000, 2350)); g += calendrier(790, 760, 'COURSE', 'J-0', .62 * p, 8); }
  const tr = choc ? (hash(pose(l)) - .5) * 18 : 0;
  g += mascotte({x: 400 + tr, y: 1300 - saut, s: 1.3, expr: t < 1.85 ? 'joie' : !choc ? 'choc' : 'panique', bras: t < 1.85 ? 'haut' : choc ? 'tete' : 'bas', tenue: {lampe: false}});
  return g;
};
S.S2 = (t, l) => {                       // La nuit. Le froid. La frontale qui clignote.
  let g = `<rect width="1080" height="1920" fill="${NUIT}"/><circle cx="830" cy="520" r="110" fill="${C.pale}"/><circle cx="880" cy="490" r="100" fill="${NUIT}"/>`;
  g += `<path d="M0 1300 L220 1080 L420 1240 L640 1020 L860 1220 L1080 1060 V1300 Z" fill="#2C3E66"/>` + `<rect x="0" y="1300" width="1080" height="620" fill="#2C3E66"/><rect x="0" y="1300" width="1080" height="12" fill="${C.noir}"/>`;
  g += flocons(l, t < 5.85 ? 10 : 18);
  const froid = t >= 4.85;
  g += etiquette(540, 330, froid ? 'NUIT · FROID' : 'LA NUIT', C.blanc, C.noir, 60);
  const clign = t >= 5.85 ? Math.floor(pose(l) / 160) % 2 === 0 : true;
  const x = 260 + prog(t, 3.5, 7.5) * 420;
  const tr = froid ? (hash(pose(l)) - .5) * 10 : 0;
  g += mascotte({x: x + tr, y: 1300 - Math.abs(Math.sin(pose(l) / 120)) * 40, s: 1.05, expr: t < 5.85 ? 'inquiet' : 'panique', bras: 'haut', tenue: {lampe: clign, incl: -8}});
  return g;
};
S.S3 = (t, l) => {                       // Le ravito ? Il l'a raté.
  let g = `<rect width="1080" height="1920" fill="${NUIT}"/><rect x="0" y="1300" width="1080" height="620" fill="#2C3E66"/><rect x="0" y="1300" width="1080" height="12" fill="${C.noir}"/>` + flocons(l, 12);
  const dx = -prog(t, 7.5, 9.55) * 260;
  g += `<g transform="translate(${dx} 0)"><rect x="560" y="1090" width="420" height="210" fill="#fff" stroke="${C.noir}" stroke-width="10"/><rect x="560" y="1050" width="420" height="60" fill="${C.jaune}" stroke="${C.noir}" stroke-width="10"/><text x="770" y="1096" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="4">RAVITO</text>`;
  if (t >= 8.6) g += `<g transform="translate(770 1200) rotate(-8)">${etiquette(0, 0, 'FERMÉ', C.rouge, '#fff', 56)}</g>`;
  g += `</g>`;
  const x = t < 8.6 ? 200 + prog(t, 7.5, 8.6) * 140 : 500 + prog(t, 8.6, 9.55) * 520;
  g += mascotte({x, y: 1300 - Math.abs(Math.sin(pose(l) / 110)) * 50, s: 1, expr: t < 8.4 ? 'inquiet' : 'panique', bras: 'haut', rot: 8, tenue: {lampe: true, incl: -8}});
  return g;
};
S.S4 = (t, l) => {                       // Rembobinons : huit semaines avant
  let g = `<rect width="1080" height="1920" fill="${C.jaune}"/>`;
  for (let i = 0; i < 6; i++) { const y = ((i * 340 + pose(l) * 1.6) % 2000) - 80; g += `<rect x="0" y="${y}" width="1080" height="18" fill="${C.noir}" opacity=".18"/>`; }
  g += `<g transform="translate(540 380)"><path d="M0 -70 L-110 0 L0 70 Z M110 -70 L0 0 L110 70 Z" fill="${C.noir}"/></g>`;
  const etapes = ['J-0', 'S-1', 'S-2', 'S-4', 'S-6', 'S-8'];
  const k = Math.min(5, Math.floor(l / 260));
  g += calendrier(540, 860, k < 5 ? 'AVANT' : 'COURSE', etapes[k], 1.1, (hash(k) - .5) * 10, k === 5 ? C.pale : '#fff');
  if (k === 5) g += etiquette(540, 1200, 'HUIT SEMAINES AVANT', C.noir, '#fff', 50);
  return g;
};
S.S5 = (t, l) => {                       // Le produit agit : allures, puis séances cochées
  let g = decor(t, 0).replace(C.rouge, C.jaune);
  if (t < 16.9) {
    const ap = rebond(prog(pose(l), 0, 420));
    const capt = `<clipPath id="ecr"><rect x="24" y="24" width="652" height="1252" rx="40"/></clipPath><image href="../assets/templates-course-a-pied-tel-allures.webp" x="24" y="24" width="652" height="1110" clip-path="url(#ecr)" preserveAspectRatio="xMidYMin slice"/>`;
    g += telephone(600, 720, .62 * ap, capt);
    const ox = 600 - 350 * .62 + 24 * .62, oy = 720 - 650 * .62 + 24 * .62, k = 652 / 780 * .62;
    const cadre = (x, y, w, h) => `<rect x="${ox + x * k}" y="${oy + y * k}" width="${w * k}" height="${h * k}" rx="14" fill="none" stroke="${C.rouge}" stroke-width="10"/>`;
    if (t >= 14.6) g += cadre(26, 548, 728, 400);
    if (t >= 15.9) g += cadre(26, 982, 728, 200);
    g += mascotte({x: 150, y: 1300, s: .6, expr: t < 14.6 ? 'joie' : 'fier', bras: 'montrer', tenue: {lampe: false}});
  } else {
    const p = rebond(prog(pose(t * 1000), 16900, 17250));
    const kx = 900 / 1480;
    g += `<g transform="translate(540 700) scale(${p})"><rect x="-470" y="-230" width="940" height="460" fill="${C.noir}" transform="translate(14 14)"/><rect x="-470" y="-230" width="940" height="460" fill="#fff" stroke="${C.noir}" stroke-width="10"/>
          <svg x="-450" y="-207" width="900" height="414" viewBox="60 160 1480 680" preserveAspectRatio="xMidYMid slice"><image href="../assets/templates-course-a-pied-plan.webp" width="1600" height="1000"/></svg>`;
    const pts = [[1440, 260, 18.4], [740, 362, 18.7], [1440, 362, 19.0], [740, 650, 19.3]];
    for (const [x, y, a] of pts) if (t >= a) g += coche(-450 + (x - 60) * kx, -207 + (y - 160) * kx, rebond(prog(pose(t * 1000), a * 1000, a * 1000 + 220)));
    g += `</g>`;
    const sem = Math.min(8, 1 + Math.floor((t - 16.9) / .35));
    g += etiquette(540, 330, `SEMAINE ${sem} / 8`, C.noir, '#fff', 56);
    g += mascotte({x: 540, y: 1300, s: .75, expr: 'fier', bras: 'montrer', tenue: {lampe: false}});
  }
  return g;
};
S.S6 = (t, l) => {                       // Payoff : Lyon au petit matin, frais ; frontale toujours allumée
  let g = `<rect width="1080" height="1920" fill="${C.pale}"/><circle cx="540" cy="1300" r="420" fill="${C.jaune}"/><rect x="0" y="1300" width="1080" height="620" fill="#D9D4C7"/>` + sol();
  const casse = t >= 21.2 ? sortie(prog(t, 21.2, 21.6)) : 0;
  g += arche('ARRIVÉE', true, casse) + etiquette(540, 260, 'LYON · PETIT MATIN', C.bleu, '#fff', 52);
  const x = 540 + Math.min(0, (t - 21.2)) * 300;
  const fini = t >= 21.6;
  g += mascotte({x: Math.max(260, x), y: 1300 - (fini ? 0 : Math.abs(Math.sin(pose(l) / 120)) * 30), s: 1.05, expr: fini ? 'fier' : 'joie', bras: fini ? 'pouce' : 'haut', tenue: {lampe: true, incl: fini ? 0 : -8}});
  if (t >= 23.4) { const p = rebond(prog(pose(t * 1000), 23400, 23750)); g += `<g transform="translate(680 820) scale(${p}) rotate(6)">${etiquette(0, 0, 'TOUJOURS ALLUMÉE', C.noir, C.jaune, 40)}</g>`; }
  return g;
};

const scene = document.getElementById('scene'), st = document.getElementById('st'), carton = document.getElementById('carton');
// Sous-titres : une réplique = un sous-titre, calé sur la voix réelle (début, fin + 0,12 s), deux lignes au plus.
const COUPES = { v02: 'La course ?<br>C’est cette nuit.', v05: 'Le ravito ?<br>Il l’a raté.', v06: 'Rembobinons.<br>Huit semaines avant.', v09: 'Lyon, au petit matin.<br>Il arrive frais.', v10: 'Et la frontale ?<br>Toujours allumée.' };
const sousTitre = (v, tv) => { if (v.st) { let s = v.st[0][1]; for (const [d, x] of v.st) if (tv - v.t >= d) s = x; return s; } return COUPES[v.id] || v.texte.replace(/'/g, '’'); };
window.placer = (ms) => {
  const tv = ms / 1000; const t = recaler(tv); ms = t * 1000; window.__t = ms;
  const fin = tv >= T.carton.debut;
  carton.style.display = fin ? 'block' : 'none';
  if (fin) { scene.innerHTML = ''; st.innerHTML = ''; return; }
  const sc = T.scenes.find((s) => t >= s.debut && t < s.fin) || T.scenes[0];
  scene.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${S[sc.id](t, ms - sc.debut * 1000)}</svg>`;
  const v = T.voix.find((r) => tv >= r.t - .05 && tv < Math.min(r.fin + .12, T.carton.debut));
  st.innerHTML = v ? `<span>${sousTitre(v, tv)}</span>` : '';
};
window.placer(0);
</script>
</body>
</html>
