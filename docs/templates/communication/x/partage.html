<style>

:root{--papier:#F0EDE6;--encre:#141414;--rouge:#D9302A;--jaune:#F5B400;--bleu:#1D4E89;--texte2:#45413A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--papier);font-family:Outfit,sans-serif;color:var(--encre)}

.sur{font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--texte2)}
.sur b{color:var(--encre)}

h1 .s{background:var(--jaune);padding:0 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pied{font-weight:600;font-size:24px;color:var(--texte2)}
