<!doctype html>
<!-- Gabarit des publications « Image » de la campagne X (1600 × 900). Copier en production/X-nn.html, changer
     l'accroche, la capture (assets/templates-<slug>-<vue>.webp, choisie dans outils/x/templates-en.json → _captures)
     et l'étiquette. Rendu : node docs/templates/communication/x/image.mjs production/X-nn.html -->
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;src:url(../../../../../assets/fonts/outfit-latin.woff2) format("woff2");font-weight:100 900}
:root{--papier:#F0EDE6;--surface:#FBFAF6;--encre:#141414;--rouge:#D9302A;--jaune:#F5B400;--bleu:#1D4E89;--texte2:#45413A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--papier);font-family:Outfit,sans-serif;color:var(--encre)}
.f{position:absolute}
.barre{left:0;right:0;top:0;height:22px;background:var(--encre)}
.rond{left:-140px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:var(--rouge)}
.carre{left:560px;top:90px;width:90px;height:90px;background:var(--bleu);border:6px solid var(--encre)}
#t{position:absolute;left:80px;top:120px;width:580px;display:flex;flex-direction:column;gap:26px}
.sur{font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--rouge)}
h1{font-weight:800;font-size:68px;line-height:1.03;letter-spacing:-.025em}
h1 mark{background:var(--jaune);padding:0 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pied{font-weight:600;font-size:28px;color:var(--texte2);line-height:1.3}
.lien{font-weight:800;font-size:32px;color:var(--bleu)}
.carte{position:absolute;left:720px;top:130px;width:820px;border:6px solid var(--encre);border-radius:16px;box-shadow:18px 18px 0 var(--encre);overflow:hidden;background:#fff}
.carte{height:540px}
.carte img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.etiquette{position:absolute;left:720px;top:690px;font-weight:800;font-size:40px}
.mention{position:absolute;right:60px;top:72px;font-weight:700;font-size:20px;letter-spacing:.06em;background:var(--encre);color:var(--papier);padding:8px 14px}
</style></head>
<body>
<div class="f barre"></div><div class="f rond"></div><div class="f carre"></div>
<div id="t">
  <div class="sur">Built by an engineer in France</div>
  <h1>Who do I<br><mark>follow up today?</mark></h1>
  <div class="pied">Every morning, the prospects to call and what is left to collect. Built for one freelancer's way of working.</div>
  <div class="lien">qm-engineering.fr/x</div>
</div>
<div class="carte"><img src="../../../../../assets/templates-crm-jour.webp" alt=""></div>
<div class="etiquette">Freelance CRM</div>
<div class="mention">FRENCH INTERFACE · SAMPLE DATA</div>
</body></html>
