<!doctype html>
<!-- Couverture Gumroad de la fiche anglaise (1280 × 720), sur le modèle de assets/templates-gantt-couverture.png.
     Rendu : serveur local (npm run dev:templates), puis capture Playwright 1280 × 720 de
     http://localhost:8888/docs/templates/communication/gantt/couverture-en.html → assets/templates-gantt-en-couverture.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/outfit.css?v=20261113">
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #141414; font-family: Outfit, system-ui, sans-serif; position: relative; color: #F0EDE6; }
  .f { position: absolute; }
  .jaune { left: 0; top: 40px; width: 300px; height: 56px; background: #F5B400; }
  .bleu { left: 120px; top: 118px; width: 240px; height: 56px; background: #1D4E89; }
  .trait { left: 300px; top: 64px; width: 30px; height: 82px; border: 6px solid #F0EDE6; border-left: 0; border-bottom: 0; }
  .texte { left: 64px; top: 252px; width: 560px; }
  .surtitre { font-size: 21px; font-weight: 800; letter-spacing: .14em; color: #F5B400; text-transform: uppercase; margin: 0 0 12px; }
  h1 { font-size: 76px; line-height: .98; font-weight: 800; letter-spacing: -.025em; margin: 0 0 30px; }
  .sous { font-size: 24px; font-weight: 600; margin: 0; }
  .logo { left: 64px; bottom: 48px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; }
  .logo b { color: #F0EDE6; } .logo i { font-style: normal; color: #4A90C2; } .logo u { text-decoration: none; color: #F5B400; }
  .ecran { left: 640px; top: 112px; width: 606px; height: 380px; overflow: hidden; background: #FBFAF6; box-shadow: 12px 12px 0 #F5B400; }
  .ecran img { position: absolute; left: -330px; top: -100px; width: 1280px; }
  .bas-bleu { left: 720px; top: 560px; width: 560px; height: 160px; background: #1D4E89; }
  .bas-rouge { left: 1060px; top: 270px; width: 220px; height: 450px; background: #D9302A; border-radius: 0 0 0 220px; transform: scaleX(-1); }
  .tel { left: 1030px; top: 300px; width: 196px; height: 334px; border: 4px solid #141414; border-radius: 24px; background: #F0EDE6; overflow: hidden; }
  .tel img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="f jaune"></div><div class="f bleu"></div><div class="f trait"></div>
  <div class="f texte">
    <p class="surtitre">Quick Gantt planner</p>
    <h1>Your plan, one line per task.</h1>
    <p class="sous">Dependencies · public holidays · critical path · A3</p>
  </div>
  <div class="f logo"><svg viewBox="0 0 80 80" width="36" height="36" aria-hidden="true"><path d="M40,0 A40,40 0 0 1 80,40 V80 H40 A40,40 0 0 1 0,40 A40,40 0 0 1 40,0 Z" fill="#F0EDE6"/><rect x="40" y="40" width="40" height="40" fill="#D9302A"/><circle cx="40" cy="40" r="15" fill="#141414"/></svg><span><b>Q</b><i>M</i><u>E</u></span></div>
  <div class="f bas-bleu"></div><div class="f bas-rouge"></div>
  <div class="f ecran"><img src="/assets/templates-gantt-en-gantt.webp" alt=""></div>
  <div class="f tel"><img src="/assets/templates-gantt-en-tel.webp" alt=""></div>
</body>
</html>
