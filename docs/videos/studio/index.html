<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Studio vidéo QME</title>
<link rel="stylesheet" href="/assets/fonts/outfit.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div id="toile">
  <div id="formes" aria-hidden="true">
    <i class="f rond jaune"></i><i class="f carre rouge"></i><i class="f tri bleu"></i><i class="f rond ciel"></i>
  </div>

  <header id="haut">
    <div id="marque"><img src="/assets/qme-symbole.svg" alt=""><span id="marque-texte">QME · Planning Gantt</span></div>
    <div id="question"></div>
  </header>

  <section id="fenetre">
    <div id="chrome"><i></i><i></i><i></i><span id="url">qm-engineering.fr/templates/gantt</span></div>
    <div id="vue">
      <div id="camera"><iframe id="app" title="Template"></iframe></div>
    </div>
  </section>

  <div id="calque"></div>
  <div id="legende"></div>
  <div id="accroche"></div>
  <div id="outro"></div>
  <div id="volet" aria-hidden="true"><i class="v jaune"></i><i class="v rouge"></i><i class="v bleu"></i></div>
  <svg id="curseur" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 3 L5 26 L11 20.5 L15.5 30 L20 28 L15.6 18.8 L23.5 18.5 Z" fill="#24221F" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<script src="studio.js"></script>

</html>
