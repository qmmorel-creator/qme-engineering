# Lien court de démo personnalisée (Angélique Benoit, « Le van à la française », 25/11/2026) : démo
# van + deux chiens du Planificateur de voyage, carte « Premiers pas » à son prénom.
[[redirects]]
  from = "/demo/angelique"
  to = "/templates/voyage/?demo=van&prenom=Ang%C3%A9lique"
  status = 302
  force = true

# Lien court de démo personnalisée (partenariat Optimind, 16/11/2026) : sans « & », que certaines
# messageries coupent. Redirection temporaire vers la démo PASS au prénom de la destinataire.
[[redirects]]
  from = "/demo/laurine"
  to = "/templates/revision/?demo=pass&prenom=Laurine"
  status = 302
  force = true

# Lien court de démo personnalisée (proposition de partenariat Yves Gautier, coach oral de concours, 16/11/2026) :
# démo « concours d'attaché territorial » au prénom du destinataire.
[[redirects]]
  from = "/demo/yves"
  to = "/templates/revision/?demo=concours&prenom=Yves"
  status = 302
  force = true

# Liens courts de démo personnalisée (affiliation BosseTesMaths et ines.maths, 17/11/2026) : même démo
# « première, spécialité maths » (profil `maths`), au prénom de chaque destinataire.
[[redirects]]
  from = "/demo/corinne"
  to = "/templates/revision/?demo=maths&prenom=Corinne"
  status = 302
  force = true

[[redirects]]
  from = "/demo/ines"
  to = "/templates/revision/?demo=maths&prenom=Ines"
  status = 302
  force = true

# Campagne X en anglais (volet sur mesure, 18/11/2026) : lien court du profil X et des publications,
# vers la page /en/english-version/ (générée par outils/x/generer.mjs). Sans « & » dans le lien affiché.
[[redirects]]
  from = "/x"
  to = "/en/english-version/?utm_source=x&utm_medium=social&utm_campaign=x-custom"
  status = 302
  force = true

# Test « Combien te coûte ta désorganisation ? » (21/11/2026) : lien court des réseaux et des partages,
# vers /diagnostic/. Plan et calendrier : docs/templates/communication/jeux/README.md
[[redirects]]
  from = "/jeu"
  to = "/diagnostic/?utm_source=social&utm_medium=jeu&utm_campaign=diagnostic"
  status = 302
  force = true

# Partenariat Odélia (Yuzu Agency, Reel Instagram + story, 22/11/2026) : lien court du sticker de la story et de
# la bio, vers la page du Pack Étudiant (chaque outil y est aussi vendu à l'unité, avec sa démo).
# Fiche : docs/templates/communication/affiliation/odelia.md
[[redirects]]
  from = "/odelia"
  to = "/packs/etudiant/?utm_source=instagram&utm_medium=influence&utm_campaign=odelia"
  status = 302
  force = true

# Même lien saisi avec une majuscule (sticker, bio) : les chemins Netlify sont sensibles à la casse (/Odelia → 404).
[[redirects]]
  from = "/Odelia"
  to = "/packs/etudiant/?utm_source=instagram&utm_medium=influence&utm_campaign=odelia"
  status = 302
  force = true

# Prospection LinkedIn BTP (20/11/2026) : lien court des invitations et messages, vers le pack Chef de projet BTP.
# Fiche : docs/templates/communication/prospection-linkedin/packs-btp-enseignant.md
[[redirects]]
  from = "/btp"
  to = "/packs/chef-de-projet-btp/?utm_source=linkedin&utm_medium=dm&utm_campaign=prosp-btp"
  status = 302
  force = true
