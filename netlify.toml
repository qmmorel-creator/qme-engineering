[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Administration (compteur d'intérêt) : jamais indexée, jamais mise en cache.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Tableau de bord des acheteurs d'un pack : jamais indexé.
[[headers]]
  for = "/packs/espace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/concepts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=300, must-revalidate"

# Applications des templates (accès par clé) : non indexées, toujours revalidées.
# Le catalogue /templates/ reste indexé.
[[headers]]
  for = "/templates/revision/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/templates/revision/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

