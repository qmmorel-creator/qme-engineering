[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/concepts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=300, must-revalidate"

# Domaine secondaire .cloud : redirection permanente vers le domaine principal
[[redirects]]
  from = "https://qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true
