[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/concepts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=300, must-revalidate"

# Domaine principal : https://qm-engineering.fr. Les autres adresses (ancien
# sous-domaine Netlify, .cloud, www) redirigent en 301 en gardant le chemin.
[[redirects]]
  from = "https://qme-engineering.netlify.app/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.fr/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true
