# Domaine secondaire .cloud : redirection permanente vers le domaine principal
# Voyage, contenu dans Vie à deux (22/11/2026).
[[redirects]]
  from = "/packs/voyage/*"
  to = "/packs/vie-a-deux/"
  status = 301
  force = true

# Bien démarrer l’année, contenu dans Productivité perso (22/11/2026).
[[redirects]]
  from = "/packs/bien-demarrer/*"
  to = "/packs/productivite/"
  status = 301
  force = true

# Cuisine, contenu dans Maison et famille (22/11/2026).
[[redirects]]
  from = "/packs/cuisine/*"
  to = "/packs/famille/"
  status = 301
  force = true

# Mariage et installation à deux, renommé Vie à deux (22/11/2026).
[[redirects]]
  from = "/packs/mariage-installation/*"
  to = "/packs/vie-a-deux/"
  status = 301
  force = true

# Pipeline de prospection B2B fusionné dans « CRM et prospection » le 22/11/2026 (rationalisation F2) :
# l'application et sa page catalogue renvoient vers celles du CRM (paramètres comme ?demo transmis).
[[redirects]]
  from = "/templates/prospection/*"
  to = "/templates/crm/"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue/prospection/*"
  to = "/catalogue/crm/"
  status = 301
  force = true

# Suivi des appels d'offres et candidatures fusionné dans « Suivi de candidatures » le 22/11/2026 (rationalisation F3) :
# l'application et sa page catalogue renvoient vers celles du suivi de candidatures (paramètres transmis).
[[redirects]]
  from = "/templates/appels-offres/*"
  to = "/templates/candidatures/"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue/appels-offres/*"
  to = "/catalogue/candidatures/"
  status = 301
  force = true

# Organisateur de mariage et Séminaire / offsite fusionnés dans « Organisateur d'événement » le 22/11/2026
# (rationalisation F1) : les applications et leurs pages catalogue renvoient vers celles de l'organisateur (paramètres transmis).
[[redirects]]
  from = "/templates/mariage/*"
  to = "/templates/evenementiel/"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue/mariage/*"
  to = "/catalogue/evenementiel/"
  status = 301
  force = true

[[redirects]]
  from = "/templates/seminaire/*"
  to = "/templates/evenementiel/"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue/seminaire/*"
  to = "/catalogue/evenementiel/"
  status = 301
  force = true

# Pilotage de parcs multi-sites fusionné dans « Maintenance préventive » (option plusieurs sites) le 22/11/2026
# (rationalisation F4) : l'application et sa page catalogue renvoient vers celles de la maintenance (paramètres transmis).
[[redirects]]
  from = "/templates/parcs-multi-sites/*"
  to = "/templates/maintenance/"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue/parcs-multi-sites/*"
  to = "/catalogue/maintenance/"
  status = 301
  force = true

# Pack Argent du quotidien retiré le 22/11/2026 (doublon du Pack Budget perso et famille).
[[redirects]]
  from = "/packs/argent-du-quotidien/*"
  to = "/packs/budget-perso-famille/"
  status = 301
  force = true

[[redirects]]
  from = "https://qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

# Ancien sous-domaine Netlify et www : redirection permanente vers le domaine principal
[[redirects]]
  from = "https://qme-engineering.netlify.app/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.fr/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

# Réorganisation du 20/11/2026 : Références et Méthode fusionnées dans la page Sur mesure (FR et EN).
# Redirections permanentes pour les liens déjà publiés (réseaux, e-mails, PDF, moteurs de recherche) ;
# les paramètres de l'adresse (utm_…) sont transmis tels quels.
[[redirects]]
  from = "/references"
  to = "/sur-mesure/#references"
  status = 301
  force = true

[[redirects]]
  from = "/methode"
  to = "/sur-mesure/#methode"
  status = 301
  force = true

[[redirects]]
  from = "/en/references"
  to = "/en/custom/#references"
  status = 301
  force = true

[[redirects]]
  from = "/en/method"
  to = "/en/custom/#method"
  status = 301
  force = true

# Documents internes (idées de templates, skills, consignes des assistants) : jamais servis
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

