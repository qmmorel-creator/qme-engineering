# Domaine secondaire .cloud : redirection permanente vers le domaine principal
[[redirects]]
  from = "https://qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.cloud/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

# Ancien sous-domaine Netlify et www : redirection permanente vers le domaine principal
[[redirects]]
  from = "https://qme-engineering.netlify.app/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.qm-engineering.fr/*"
  to = "https://qm-engineering.fr/:splat"
  status = 301
  force = true

# Documents internes (idées de templates, skills, consignes des assistants) : jamais servis
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

